<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>HldsMonitoring — Анализ телеметрии ReHLDS</title>
<style>
  /* ------------------------------------------------------------------ */
  /*  Design tokens — all visual values trace back to this block.        */
  /* ------------------------------------------------------------------ */
  :root {
    --bg:        #0b0f14;
    --bg-2:      #0f1620;
    --panel:     #131c27;
    --panel-2:   #17222f;
    --border:    #223141;
    --border-2:  #2d4053;
    --text:      #e7eef6;
    --text-mut:  #93a4b8;
    --text-dim:  #6b7d92;
    --accent:    #4ea1ff;
    --accent-2:  #7cbcff;
    --accent-ink:#04121f;
    --ok:        #34d399;
    --warn:      #fbbf24;
    --err:       #f87171;
    --violet:    #c084fc;
    --pink:      #f472b6;

    --r-sm: 6px;
    --r-md: 10px;
    --r-lg: 14px;

    --sp-1: 4px;
    --sp-2: 8px;
    --sp-3: 12px;
    --sp-4: 16px;
    --sp-5: 24px;
    --sp-6: 32px;
    --sp-7: 48px;

    --shadow-1: 0 1px 2px rgba(0,0,0,.4);
    --shadow-2: 0 8px 30px rgba(0,0,0,.35);
    --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    --t-fast: 120ms ease;

    /* measured height of .topbar; updated on load/resize so sticky panels sit flush under it */
    --topbar-h: 56px;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background:
      radial-gradient(1100px 520px at 82% -12%, rgba(78,161,255,.10), transparent 60%),
      radial-gradient(760px 420px at -8% 8%, rgba(52,211,153,.06), transparent 55%),
      var(--bg);
    color: var(--text);
    font-family: var(--font);
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  a { color: var(--accent-2); }

  /* ---------------------------------------------------------------- */
  /*  Top bar                                                          */
  /* ---------------------------------------------------------------- */
  .topbar {
    position: sticky; top: 0; z-index: 40;
    display: flex; align-items: center; gap: var(--sp-4);
    flex-wrap: wrap;
    padding: var(--sp-3) var(--sp-5);
    background: rgba(11,15,20,.82);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
  }
  .brand { display: flex; align-items: center; gap: var(--sp-3); min-width: 0; }
  .brand-mark {
    width: 34px; height: 34px; flex: 0 0 auto; border-radius: 9px;
    display: grid; place-items: center;
    background: linear-gradient(145deg, #16324b, #0e1c2b);
    border: 1px solid var(--border-2);
  }
  .brand-mark svg { width: 20px; height: 20px; display: block; }
  .brand-txt { min-width: 0; }
  .brand-title { font-weight: 650; letter-spacing: .2px; line-height: 1.15; }
  .brand-sub { font-size: 11.5px; color: var(--text-dim); }
  .topbar-spacer { flex: 1 1 auto; }
  .toolbar { display: flex; align-items: center; gap: var(--sp-2); flex-wrap: wrap; }

  .badge {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 11.5px; color: var(--text-mut);
    padding: 4px 9px; border: 1px solid var(--border);
    border-radius: 999px; background: var(--panel);
    white-space: nowrap;
  }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text-dim); flex: 0 0 auto; }
  .dot.ok { background: var(--ok); box-shadow: 0 0 0 3px rgba(52,211,153,.15); }
  .dot.err { background: var(--err); box-shadow: 0 0 0 3px rgba(248,113,113,.15); }

  /* ---------------------------------------------------------------- */
  /*  Buttons                                                          */
  /* ---------------------------------------------------------------- */
  .btn {
    font: inherit; font-size: 13px; font-weight: 550;
    color: var(--text); background: var(--panel-2);
    border: 1px solid var(--border-2);
    padding: 7px 12px; border-radius: var(--r-sm);
    cursor: pointer; transition: background var(--t-fast), border-color var(--t-fast), transform var(--t-fast);
    display: inline-flex; align-items: center; gap: 7px;
    white-space: nowrap;
  }
  .btn:hover:not(:disabled) { background: #1d2a39; border-color: #3a526a; }
  .btn:active:not(:disabled) { transform: translateY(1px); }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .btn:disabled { opacity: .42; cursor: not-allowed; }
  .btn.primary {
    background: var(--accent); border-color: var(--accent); color: var(--accent-ink);
    font-weight: 650;
  }
  .btn.primary:hover:not(:disabled) { background: var(--accent-2); border-color: var(--accent-2); }
  .btn.ghost { background: transparent; border-color: var(--border); color: var(--text-mut); }
  .btn.ghost:hover:not(:disabled) { color: var(--text); border-color: var(--border-2); }
  .btn.sm { padding: 5px 9px; font-size: 12px; }
  .btn .spinner {
    width: 13px; height: 13px; border-radius: 50%;
    border: 2px solid rgba(255,255,255,.35); border-top-color: #fff;
    animation: spin .7s linear infinite;
  }
  .btn.primary .spinner { border-color: rgba(4,18,31,.35); border-top-color: var(--accent-ink); }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---------------------------------------------------------------- */
  /*  Layout                                                           */
  /* ---------------------------------------------------------------- */
  main { max-width: 1220px; margin: 0 auto; padding: var(--sp-5); display: grid; gap: var(--sp-5); }
  .panel {
    background: linear-gradient(180deg, var(--panel), #101926);
    border: 1px solid var(--border);
    border-radius: var(--r-lg);
    box-shadow: var(--shadow-1);
    overflow: hidden;
  }
  .panel-head {
    display: flex; align-items: center; gap: var(--sp-3);
    flex-wrap: wrap;
    padding: var(--sp-4) var(--sp-5);
    border-bottom: 1px solid var(--border);
    background: linear-gradient(180deg, rgba(255,255,255,.015), transparent);
  }
  .panel-head h2 { margin: 0; font-size: 15px; font-weight: 650; letter-spacing: .2px; }
  .panel-head .count-pill {
    font-size: 11.5px; color: var(--text-mut); background: var(--bg-2);
    border: 1px solid var(--border); border-radius: 999px; padding: 2px 9px;
  }
  .panel-head .head-spacer { flex: 1 1 auto; }
  .panel-body { padding: var(--sp-5); }
  .panel-toggle {
    display: inline-flex; align-items: center; gap: var(--sp-2);
    background: none; border: 0; margin: 0; padding: 0;
    color: inherit; font: inherit; text-align: left;
    cursor: pointer; border-radius: var(--r-sm); min-width: 0;
  }
  .panel-toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .panel-toggle .chevron { color: var(--text-dim); font-size: 12px; width: 12px; text-align: center; flex: 0 0 auto; }
  .panel-toggle:hover h2 { color: var(--accent-2); }
  .panel.collapsed .panel-head { border-bottom: 0; }
  .panel.collapsed .panel-body { display: none; }

  /* sticky period panel: pins right under the sticky topbar (z-index below 40),
     with a solid background so charts scroll beneath it */
  .panel-sticky {
    position: sticky;
    top: var(--topbar-h, 56px);
    z-index: 30;
    background: var(--bg-2);
    border-bottom: 1px solid var(--border-2);
    box-shadow: 0 12px 24px -12px rgba(0,0,0,.7), var(--shadow-1);
  }

  /* player session chips (combined panel: drill into one session) */
  .player-sessions { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 2px; }
  .player-sessions[hidden] { display: none; }
  .player-sessions-label {
    font-size: 11.5px; color: var(--text-dim);
    text-transform: uppercase; letter-spacing: .5px;
  }
  .session-chip {
    font: inherit; font-size: 11.5px; color: var(--text-mut);
    background: var(--bg-2); border: 1px solid var(--border-2);
    border-radius: 999px; padding: 3px 9px; cursor: pointer;
    transition: color var(--t-fast), border-color var(--t-fast), background var(--t-fast);
  }
  .session-chip:hover { color: var(--text); border-color: var(--accent); }
  .session-chip.active { color: var(--accent-ink); background: var(--accent); border-color: var(--accent); }
  .muted { color: var(--text-mut); }
  .dim { color: var(--text-dim); }
  .empty {
    color: var(--text-dim); font-style: normal; padding: var(--sp-4) 0;
    display: flex; align-items: center; gap: var(--sp-3);
  }
  .empty::before { content: ""; width: 3px; height: 16px; background: var(--border-2); border-radius: 2px; }

  /* ---------------------------------------------------------------- */
  /*  Upload                                                           */
  /* ---------------------------------------------------------------- */
  .upload-grid { display: grid; grid-template-columns: 1.6fr 1fr; gap: var(--sp-5); }
  @media (max-width: 820px) { .upload-grid { grid-template-columns: 1fr; } }

  .dropzone {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: var(--sp-2); text-align: center;
    padding: var(--sp-6) var(--sp-4);
    border: 1.5px dashed var(--border-2); border-radius: var(--r-md);
    background: var(--bg-2); cursor: pointer;
    transition: border-color var(--t-fast), background var(--t-fast);
  }
  .dropzone:hover { border-color: var(--accent); background: #101a26; }
  .dropzone:focus-within { border-color: var(--accent); outline: 2px solid rgba(78,161,255,.35); outline-offset: 2px; }
  .dropzone.drag { border-color: var(--accent); background: #0e1c2b; border-style: solid; }
  .dropzone svg { width: 34px; height: 34px; color: var(--accent); }
  .dz-title { font-weight: 600; }
  .dz-hint { font-size: 12px; color: var(--text-dim); }
  .visually-hidden {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }

  .file-list { display: flex; flex-direction: column; gap: var(--sp-2); }
  .file-list-head { display: flex; align-items: baseline; justify-content: space-between; gap: var(--sp-2); }
  .file-list-head .label { font-size: 12px; text-transform: uppercase; letter-spacing: .6px; color: var(--text-dim); }
  .file-items { display: flex; flex-direction: column; gap: 6px; max-height: 190px; overflow-y: auto; }
  .file-item {
    display: flex; align-items: center; gap: var(--sp-2);
    padding: 6px 10px; background: var(--bg-2);
    border: 1px solid var(--border); border-radius: var(--r-sm);
    font-size: 12.5px;
  }
  .file-item .fi-name { flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--mono); font-size: 12px; }
  .file-item .fi-size { color: var(--text-dim); font-size: 11.5px; }
  .file-item .fi-x {
    border: 0; background: transparent; color: var(--text-dim); cursor: pointer;
    font-size: 15px; line-height: 1; padding: 2px 4px; border-radius: 4px;
  }
  .file-item .fi-x:hover { color: var(--err); background: rgba(248,113,113,.1); }

  .actions-row { display: flex; align-items: center; gap: var(--sp-3); flex-wrap: wrap; margin-top: var(--sp-4); }
  .status { font-size: 13px; display: flex; align-items: center; gap: 7px; min-height: 20px; }
  .status.error { color: var(--err); }
  .status.ok { color: var(--ok); }
  .status.info { color: var(--text-mut); }

  /* ---------------------------------------------------------------- */
  /*  FTP live-tail                                                    */
  /* ---------------------------------------------------------------- */
  .ftp-grid {
    display: grid; gap: var(--sp-3);
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    align-items: end;
  }
  .ftp-grid .field.wide { grid-column: 1 / -1; }
  .ftp-grid .field input {
    font: inherit; font-size: 13px; color: var(--text);
    background: var(--bg-2); border: 1px solid var(--border-2);
    border-radius: var(--r-sm); padding: 6px 9px; width: 100%; min-width: 0;
  }
  .ftp-grid .field input[type="text"], .ftp-grid .field input[type="password"] { font-family: var(--mono); }
  .ftp-grid .field input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .ftp-row-check { display: flex; align-items: center; gap: var(--sp-2); font-size: 12.5px; color: var(--text-mut); padding: 7px 0; }
  .ftp-row-check input { accent-color: var(--accent); width: 15px; height: 15px; }
  .ftp-actions { display: flex; align-items: center; gap: var(--sp-2); flex-wrap: wrap; margin-top: var(--sp-4); }
  .ftp-auto { display: flex; align-items: center; gap: var(--sp-2); margin-left: auto; font-size: 12.5px; color: var(--text-mut); }
  .ftp-auto input[type="number"] {
    width: 72px; font: inherit; font-size: 13px; color: var(--text);
    background: var(--bg-2); border: 1px solid var(--border-2);
    border-radius: var(--r-sm); padding: 5px 7px;
  }
  #ftpStatus { margin-top: var(--sp-3); }
  .ftp-progress { margin-top: var(--sp-3); }
  .ftp-progress[hidden] { display: none; }
  .ftp-progress-track { height: 8px; border-radius: 999px; background: var(--bg-2); border: 1px solid var(--border-2); overflow: hidden; }
  .ftp-progress-fill { height: 100%; width: 0%; border-radius: 999px; background: var(--accent); transition: width .2s ease; }
  .ftp-progress.indeterminate .ftp-progress-fill { width: 35%; animation: ftpIndet 1.1s ease-in-out infinite; }
  .ftp-progress.analyzing .ftp-progress-fill { background: var(--warn); }
  @keyframes ftpIndet { 0% { margin-left: 0%; } 50% { margin-left: 65%; } 100% { margin-left: 0%; } }
  .ftp-progress-label { margin-top: 6px; font-size: 12.5px; color: var(--text-mut); font-variant-numeric: tabular-nums; }

  /* ---------------------------------------------------------------- */
  /*  Summary cards                                                    */
  /* ---------------------------------------------------------------- */
  #results { display: grid; gap: var(--sp-5); }
  .cards {
    display: grid; gap: var(--sp-3);
    grid-template-columns: repeat(auto-fit, minmax(148px, 1fr));
  }
  .card {
    background: linear-gradient(180deg, var(--panel), #0f1722);
    border: 1px solid var(--border); border-radius: var(--r-md);
    padding: var(--sp-4);
    position: relative; overflow: hidden;
  }
  .card::after {
    content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
    background: var(--accent); opacity: .55;
  }
  .card.accent-ok::after { background: var(--ok); }
  .card.accent-warn::after { background: var(--warn); }
  .card.accent-err::after { background: var(--err); }
  .card .k { font-size: 11.5px; text-transform: uppercase; letter-spacing: .7px; color: var(--text-dim); }
  .card .v { font-size: 24px; font-weight: 680; margin-top: 6px; letter-spacing: .3px; font-variant-numeric: tabular-nums; }
  .card .v.sm { font-size: 15px; font-weight: 600; }
  .card .s { font-size: 11.5px; color: var(--text-mut); margin-top: 3px; }

  /* ---------------------------------------------------------------- */
  /*  Type bars                                                        */
  /* ---------------------------------------------------------------- */
  .bars { display: flex; flex-direction: column; gap: var(--sp-3); }
  .bar-row { display: grid; grid-template-columns: 118px 1fr 72px; align-items: center; gap: var(--sp-3); }
  @media (max-width: 520px) { .bar-row { grid-template-columns: 88px 1fr 56px; gap: var(--sp-2); } }
  .bar-label { font-size: 12.5px; font-family: var(--mono); color: var(--text-mut); overflow: hidden; text-overflow: ellipsis; }
  .bar-track { height: 10px; background: var(--bg-2); border: 1px solid var(--border); border-radius: 999px; overflow: hidden; }
  .bar-fill { height: 100%; background: linear-gradient(90deg, var(--accent), #6ec2ff); border-radius: 999px; transition: width .35s ease; }
  .bar-val { text-align: right; font-variant-numeric: tabular-nums; font-size: 13px; }

  /* ---------------------------------------------------------------- */
  /*  Charts                                                           */
  /* ---------------------------------------------------------------- */
  .charts { display: grid; gap: var(--sp-5); }
  .chart { position: relative; border: 1px solid var(--border); border-radius: var(--r-md); background: var(--bg-2); overflow: hidden; }
  .chart-head { display: flex; align-items: center; gap: var(--sp-3); flex-wrap: wrap; padding: var(--sp-3) var(--sp-4); border-bottom: 1px solid var(--border); }
  .chart-title { font-size: 13px; font-weight: 620; }
  .chart-title .unit { color: var(--text-dim); font-weight: 450; font-size: 12px; }
  .legend { display: flex; gap: var(--sp-3); flex-wrap: wrap; margin-left: auto; }
  .legend-item { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; color: var(--text-mut); }
  .swatch { width: 12px; height: 3px; border-radius: 2px; display: inline-block; }
  .chart-plot { position: relative; overflow-x: auto; }
  .chart-svg { width: 100%; min-width: 560px; height: auto; aspect-ratio: 820 / 240; display: block; }
  .chart-svg .grid line { stroke: var(--border); stroke-width: 1; }
  .chart-svg .grid line.base { stroke: var(--border-2); }
  .chart-svg .grid text { fill: var(--text-dim); font-size: 11.5px; font-family: var(--mono); }
  .chart-svg .axis text { fill: var(--text-mut); font-size: 11.5px; font-family: var(--mono); }
  .chart-svg .spark { fill: none; stroke-width: 1.7; stroke-linejoin: round; stroke-linecap: round; }
  .chart-svg .hover-line { stroke: var(--text-mut); stroke-width: 1; stroke-dasharray: 3 3; opacity: 0; }
  .chart-svg .hover-dot { opacity: 0; stroke: var(--bg-2); stroke-width: 1.5; }
  .chart-tip {
    position: absolute; top: 6px; left: 0; pointer-events: none;
    background: rgba(6,11,17,.96); border: 1px solid var(--border-2);
    border-radius: var(--r-sm); padding: 7px 9px; font-size: 11.5px;
    box-shadow: var(--shadow-2); transform: translateX(-50%);
    opacity: 0; transition: opacity 90ms ease; max-width: calc(100% - 12px); z-index: 5;
  }
  .chart-tip .tt-time { color: var(--text-mut); font-family: var(--mono); font-size: 10.5px; margin-bottom: 4px; white-space: nowrap; }
  .chart-tip .tt-row { display: flex; align-items: center; gap: 6px; font-variant-numeric: tabular-nums; }
  .chart-tip .tt-row .swatch { width: 9px; height: 9px; border-radius: 2px; flex: 0 0 auto; }
  .chart-tip .tt-row .tt-name { color: var(--text-mut); }
  .chart-tip .tt-row .tt-val { margin-left: auto; font-weight: 600; padding-left: 10px; white-space: nowrap; }
  .chart-svg .bars rect { fill-opacity: .85; }
  /* host overlay: a caveated point is present but not attributable — ring, not fill */
  .chart-svg .caveat-marker { fill: none; stroke: #fbbf24; stroke-width: 1.3; }
  .chart-tip .tt-row .tt-note { color: #fbbf24; font-size: 10.5px; white-space: nowrap; }
  .ds-legend { display: flex; flex-wrap: wrap; gap: 6px var(--sp-3); align-items: center; }
  .ds-legend .hint { font-size: 11.5px; color: var(--text-dim); }
  .ds-legend .leg-sep { color: var(--text-dim); font-size: 11.5px; margin-left: 6px; }
  .bundle-mins { width: 52px; background: var(--bg-2); color: var(--text);
    border: 1px solid var(--border-2); border-radius: var(--r-sm); padding: 3px 5px;
    font-size: 12px; font-variant-numeric: tabular-nums; }

  /* config-diff panel: one row per snapshot, diff chips for tracked changes */
  .config-list { display: flex; flex-direction: column; gap: 6px; }
  .config-row { border: 1px solid var(--border); border-radius: var(--r-sm); padding: 7px 9px; background: var(--bg-2); }
  .config-head { display: flex; gap: var(--sp-3); align-items: baseline; flex-wrap: wrap; }
  .config-time { font-family: var(--mono); font-size: 12px; color: var(--text-mut); }
  .config-summary { font-size: 12px; color: var(--text-dim); }
  .config-baseline { font-size: 11.5px; color: var(--text-dim); margin-top: 4px; }
  .config-diff { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 4px; }
  .diff-chip { font-size: 11.5px; font-family: var(--mono); padding: 1px 6px;
    border: 1px solid var(--border); border-radius: 999px; }
  .diff-chip.changed { color: #fbbf24; }
  .diff-chip.added { color: #34d399; }
  .diff-chip.removed { color: #f87171; }

  /* compact «Справка» under the combined chart: metric -> one-line note */
  .metric-help { margin-top: var(--sp-4); border-top: 1px solid var(--border); padding-top: var(--sp-3); }
  .metric-help[hidden] { display: none; }
  .metric-help-list { display: grid; gap: 5px 18px; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
  .metric-help-row { display: flex; gap: var(--sp-3); align-items: baseline; font-size: 12px; line-height: 1.4; }
  .metric-help-key { flex: 0 0 auto; min-width: 92px; font-family: var(--mono); color: var(--text-mut); }
  .metric-help-note { color: var(--text-dim); }

  /* brief highlight when «фокус» scrolls to the combined panel */
  .panel.flash { animation: panelFlash 1.5s ease; }
  @keyframes panelFlash {
    0%   { box-shadow: 0 0 0 2px var(--accent), var(--shadow-2); }
    100% { box-shadow: var(--shadow-1); }
  }
  @media (prefers-reduced-motion: reduce) { .panel.flash { animation: none; box-shadow: 0 0 0 2px var(--accent); } }
  .focus-ivl { font-family: var(--mono); }

  /* ---------------------------------------------------------------- */
  /*  Tables                                                           */
  /* ---------------------------------------------------------------- */
  .controls { display: flex; gap: var(--sp-3); flex-wrap: wrap; align-items: flex-end; }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field label { font-size: 11.5px; color: var(--text-dim); text-transform: uppercase; letter-spacing: .5px; }
  .field select, .field input[type="search"], .field input[type="text"], .field input[type="datetime-local"] {
    font: inherit; font-size: 13px; color: var(--text);
    background: var(--bg-2); border: 1px solid var(--border-2);
    border-radius: var(--r-sm); padding: 6px 9px; min-width: 160px;
  }
  .field input[type="text"] { min-width: 190px; font-family: var(--mono); }
  .field select:focus, .field input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .period-hint { font-size: 12px; color: var(--text-dim); margin-top: var(--sp-3); }
  .period-hint.active { color: var(--accent-2); }

  /* period mini-timeline (brush) */
  .period-timeline { margin-bottom: var(--sp-4); }
  .period-timeline-empty { font-size: 12px; color: var(--text-dim); padding: var(--sp-2) 0; }
  .period-brush { width: 100%; height: 44px; display: block; touch-action: none; overflow: visible; }
  .period-brush .period-track { fill: var(--bg-2); stroke: var(--border-2); stroke-width: 1; }
  .period-brush .period-dim { fill: rgba(11,15,20,.62); }
  .period-brush .period-sel { fill: rgba(78,161,255,.22); stroke: var(--accent); stroke-width: 1; cursor: grab; }
  .period-brush .period-sel:active { cursor: grabbing; }
  .period-brush .period-brush-handle { cursor: ew-resize; }
  .period-brush .handle-hit { fill: transparent; pointer-events: all; }
  .period-brush .handle-bar { fill: var(--accent); }
  .period-brush .handle-grip { stroke: var(--accent-ink); stroke-width: 1; stroke-linecap: round; }
  .period-brush .period-brush-handle:hover .handle-bar { fill: var(--accent-2); }
  .period-brush .period-brush-handle:focus { outline: none; }
  .period-brush .period-brush-handle:focus .handle-bar { fill: var(--accent-2); stroke: var(--text); stroke-width: 1.5; }
  .period-timeline-label { font-size: 12px; color: var(--text-mut); font-variant-numeric: tabular-nums; margin-top: 4px; font-family: var(--mono); }

  /* period "follow" (live end): a non-interactive live pill + live brush styling.
     Following == the period has NO upper bound (state.period.to == null). */
  .period-live {
    display: none; align-items: center; gap: 5px;
    font-size: 11px; font-weight: 600; color: var(--ok);
    background: rgba(52,211,153,.08); border: 1px solid rgba(52,211,153,.4);
    border-radius: 999px; padding: 2px 9px;
  }
  .period-live.on { display: inline-flex; }
  .period-live .live-dot { position: relative; width: 7px; height: 7px; border-radius: 50%; background: var(--ok); }
  .period-live .live-dot::after {
    content: ""; position: absolute; inset: 0; border-radius: 50%;
    background: var(--ok); opacity: .7;
    animation: livePulse 1.6s ease-out infinite;
  }
  @keyframes livePulse {
    0%   { transform: scale(1);   opacity: .7; }
    100% { transform: scale(2.6); opacity: 0;  }
  }
  @media (prefers-reduced-motion: reduce) { .period-live .live-dot::after { animation: none; opacity: 0; } }
  /* brush: while following, the right edge is the live (tracking) end */
  .period-brush .period-end-dot { display: none; fill: var(--ok); }
  .period-brush.follow .period-end-dot { display: block; }
  .period-brush.follow .period-sel { stroke: var(--accent-2); }
  .period-brush.follow .period-brush-handle.end .handle-bar { fill: var(--ok); filter: drop-shadow(0 0 4px rgba(52,211,153,.7)); }
  .table-wrap { overflow-x: auto; margin-top: var(--sp-4); border: 1px solid var(--border); border-radius: var(--r-md); }
  table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
  thead th {
    position: sticky; top: 0;
    background: var(--panel-2); color: var(--text-mut);
    text-align: left; font-weight: 600; font-size: 11px;
    text-transform: uppercase; letter-spacing: .5px;
    padding: 9px var(--sp-3); border-bottom: 1px solid var(--border-2);
    white-space: nowrap;
  }
  tbody td { padding: 8px var(--sp-3); border-bottom: 1px solid var(--border); white-space: nowrap; font-variant-numeric: tabular-nums; }
  tbody tr:last-child td { border-bottom: 0; }
  tbody tr:nth-child(even) { background: rgba(255,255,255,.014); }
  tbody tr:hover { background: rgba(78,161,255,.05); }
  td.mono, th.mono { font-family: var(--mono); }
  td.num { text-align: right; }
  .tag {
    display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 11px;
    border: 1px solid var(--border-2); background: var(--bg-2); color: var(--text-mut);
  }
  .tag.cat-timeout  { color: #fca5a5; border-color: rgba(248,113,113,.4); background: rgba(248,113,113,.08); }
  .tag.cat-overflow { color: #fdba74; border-color: rgba(251,146,60,.4);  background: rgba(251,146,60,.08); }
  .tag.cat-user     { color: #86efac; border-color: rgba(52,211,153,.35); background: rgba(52,211,153,.08); }
  .tag.crash        { color: var(--err); border-color: rgba(248,113,113,.5); background: rgba(248,113,113,.1); }
  .pager {
    display: flex; align-items: center; gap: var(--sp-3); flex-wrap: wrap;
    margin-top: var(--sp-3); color: var(--text-mut); font-size: 12px;
  }
  .pager .pager-size {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 11.5px; color: var(--text-dim); text-transform: uppercase; letter-spacing: .5px;
  }
  .pager .pager-size select {
    font: inherit; font-size: 12px; color: var(--text); text-transform: none; letter-spacing: 0;
    background: var(--bg-2); border: 1px solid var(--border-2);
    border-radius: var(--r-sm); padding: 4px 7px;
  }
  .pager .pager-size select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .pager .pager-label { font-variant-numeric: tabular-nums; }
  .pager .btn.sm { padding: 4px 10px; line-height: 1; }

  /* period / events / navigation extras */
  .info-line {
    display: flex; align-items: center; gap: var(--sp-2); flex-wrap: wrap;
    font-size: 12.5px; color: var(--text-mut);
    background: var(--bg-2); border: 1px solid var(--border);
    border-radius: var(--r-md); padding: 9px var(--sp-4);
  }
  .info-line .pill { color: var(--text); }
  .badge.bad-ok   { color: #86efac; border-color: rgba(52,211,153,.4); background: rgba(52,211,153,.08); }
  .badge.bad-err  { color: #fca5a5; border-color: rgba(248,113,113,.45); background: rgba(248,113,113,.1); }
  .badge.bad-mut  { color: var(--text-mut); }
  .evt-toggle {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 11.5px; color: var(--text-mut); cursor: pointer; user-select: none;
  }
  .evt-toggle input { accent-color: var(--accent); width: 14px; height: 14px; }
  .band-legend { display: flex; gap: var(--sp-2); flex-wrap: wrap; }
  .band-legend .swatch { width: 11px; height: 11px; border-radius: 3px; }
  .head-tools { display: flex; align-items: center; gap: var(--sp-3); flex-wrap: wrap; margin-left: auto; }
  tbody tr.clickable { cursor: pointer; }
  tbody tr.row-active { background: rgba(78,161,255,.14) !important; box-shadow: inset 3px 0 0 var(--accent); }
  .row-id { font-family: var(--mono); }
  .flags { display: inline-flex; gap: 4px; }

  .anoms { display: flex; flex-direction: column; gap: var(--sp-2); }
  .anom {
    display: flex; gap: var(--sp-3); align-items: flex-start;
    padding: var(--sp-3); border-radius: var(--r-sm);
    background: rgba(251,191,36,.06); border: 1px solid rgba(251,191,36,.22);
    font-size: 13px;
  }
  .anom svg { width: 16px; height: 16px; color: var(--warn); flex: 0 0 auto; margin-top: 2px; }
  .anom.info { background: rgba(78,161,255,.06); border-color: rgba(78,161,255,.22); }
  .anom.info svg { color: var(--accent); }

  footer { max-width: 1220px; margin: 0 auto; padding: var(--sp-5); color: var(--text-dim); font-size: 12px; display: flex; gap: var(--sp-4); flex-wrap: wrap; align-items: center; }

  #toast {
    position: fixed; right: 18px; bottom: 18px; z-index: 90;
    display: flex; flex-direction: column; gap: var(--sp-2); align-items: flex-end;
  }
  .toast {
    background: var(--panel-2); border: 1px solid var(--border-2); border-left: 3px solid var(--accent);
    border-radius: var(--r-sm); padding: 10px 14px; font-size: 13px; box-shadow: var(--shadow-2);
    max-width: 340px; animation: toast-in 160ms ease;
  }
  .toast.error { border-left-color: var(--err); }
  .toast.ok { border-left-color: var(--ok); }
  @keyframes toast-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  @media (max-width: 640px) {
    main { padding: var(--sp-3); gap: var(--sp-4); }
    .topbar { padding: var(--sp-2) var(--sp-3); }
    .panel-body { padding: var(--sp-4); }
    .brand-sub { display: none; }
  }

  /* ------------------------------------------------------------------ */
  /*  Stage 12 «large-logs» — compact «Период» (L7) + sticky toggle (L8)  */
  /*  The whole sticky block must stay <= PERIOD_MAX_HEIGHT_PX (96px):     */
  /*  row 1 (header) = title + status pill + range text + live cue + the   */
  /*  one global client picker + the sticky toggle;                        */
  /*  row 2 (body)   = the full-width draggable timeline.                  */
  /* ------------------------------------------------------------------ */
  .period-panel .panel-head {
    padding: 3px 12px;
    /* keep the header on ONE line at any width (horizontal scroll on narrow
       viewports instead of wrapping) so the block height stays constant. */
    flex-wrap: nowrap; overflow-x: auto; overflow-y: hidden; min-width: 0;
    scrollbar-width: none; -ms-overflow-style: none;
  }
  .period-panel .panel-head::-webkit-scrollbar { display: none; width: 0; height: 0; }
  .period-panel .panel-head h2 { font-size: 13.5px; }
  .period-panel .panel-toggle { flex-wrap: nowrap; white-space: nowrap; flex: 0 0 auto; }
  .period-panel .panel-body { padding: 6px 12px; }
  .period-row {
    display: flex; align-items: center; gap: var(--sp-2);
    flex-wrap: nowrap; overflow-x: auto; overflow-y: hidden;
    min-width: 0;
    /* L7: a visible horizontal scrollbar on a narrow viewport adds ~15px and
       breaks the <= PERIOD_MAX_HEIGHT_PX (96px) budget. Keep the scroll (wheel/
       trackpad/touch) but hide the bar so the block height stays constant. */
    scrollbar-width: none; -ms-overflow-style: none;
  }
  .period-row::-webkit-scrollbar { display: none; width: 0; height: 0; }
  .period-row .field { flex: 0 0 auto; }
  .period-row .field label { display: none; }
  .period-row select { min-width: 0; padding: 4px 7px; font-size: 12px; }
  .period-range {
    flex: 0 0 auto; font-family: var(--mono); font-size: 11.5px;
    color: var(--text-mut); font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  .period-timeline-row { margin-top: 2px; }
  .period-timeline-row .period-tl { width: 100%; }
  .period-timeline-row .period-timeline { margin-bottom: 0; }
  .period-timeline-row .period-brush { width: 100%; height: 26px; }
  .period-timeline-row .period-timeline-label { margin-top: 1px; font-size: 10.5px; line-height: 1.15; white-space: nowrap; }
  .period-timeline-row .period-timeline-empty { padding: 0; font-size: 11px; }
  .period-sticky-toggle {
    display: inline-flex; align-items: center; gap: 5px; flex: 0 0 auto;
    font-size: 11.5px; color: var(--text-mut); cursor: pointer; user-select: none;
  }
  .period-sticky-toggle input { accent-color: var(--accent); width: 14px; height: 14px; }
  /* REQ-L8: the user can turn pinning off; applied without a reload */
  .panel-sticky.no-sticky { position: static; }

  /* FTP window bar (REQ-L6): window size + loaded-range/time + reached_start + cap_hit */
  .ftp-window-bar { display: flex; align-items: center; gap: var(--sp-2) var(--sp-3); flex-wrap: wrap; margin-top: var(--sp-3); }
  .ftp-window-bar select {
    font: inherit; font-size: 13px; color: var(--text);
    background: var(--bg-2); border: 1px solid var(--border-2);
    border-radius: var(--r-sm); padding: 4px 7px;
  }
  .ftp-window-bar select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .ftp-range {
    font-family: var(--mono); font-size: 12px; color: var(--text-mut);
    background: var(--bg-2); border: 1px solid var(--border);
    border-radius: var(--r-sm); padding: 3px 9px; font-variant-numeric: tabular-nums;
  }
  .ftp-reached { font-size: 12px; color: var(--ok); }
  .ftp-cap { font-size: 12px; color: var(--warn); }
</style>
</head>
<body>
<noscript><div style="padding:24px;color:#f87171">Для работы интерфейса требуется JavaScript.</div></noscript>

<header class="topbar">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="#4ea1ff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 17l4-6 3 3 4-8 3 5 4-3"/><path d="M3 21h18"/>
      </svg>
    </span>
    <span class="brand-txt">
      <div class="brand-title">HldsMonitoring</div>
      <div class="brand-sub">анализ телеметрии ReHLDS · офлайн</div>
    </span>
  </div>

  <div class="topbar-spacer"></div>

  <div class="toolbar" role="group" aria-label="Экспорт">
    <span id="logEndBadge" class="badge" hidden></span>
    <span id="modeBadge" class="badge" hidden></span>
    <button class="btn sm ghost" id="btnServer" disabled data-type="server">CSV: сервер</button>
    <button class="btn sm ghost" id="btnClient" disabled data-type="client">CSV: клиенты</button>
    <button class="btn sm ghost" id="btnDrop"   disabled data-type="drop">CSV: drops</button>
    <button class="btn sm ghost" id="btnAll"    disabled data-type="">CSV: всё</button>
  </div>
</header>

<main>
  <!-- ===================== Upload ===================== -->
  <section class="panel" id="uploadPanel">
    <div class="panel-head">
      <h2>Исходные данные</h2>
      <span class="count-pill">JSONL · несколько файлов</span>
      <div class="head-spacer"></div>
      <span class="badge" id="healthBadge"><span class="dot" id="healthDot"></span><span id="healthText">проверка сервера…</span></span>
    </div>
    <div class="panel-body">
      <div class="upload-grid">
        <div>
          <label class="dropzone" id="dropzone" tabindex="0" role="button" aria-label="Выбрать файлы телеметрии: перетащите или нажмите Enter">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M12 16V4"/><path d="M7 9l5-5 5 5"/><path d="M4 16v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/>
            </svg>
            <span class="dz-title">Перетащите файлы сюда</span>
            <span class="dz-hint">или нажмите, чтобы выбрать · .jsonl .json .txt .log</span>
            <input type="file" id="fileInput" class="visually-hidden" multiple accept=".jsonl,.json,.txt,.log">
          </label>

          <div class="actions-row">
            <button class="btn primary" id="btnAnalyze" disabled>
              <span class="label">Анализ</span>
            </button>
            <button class="btn" id="btnDemo" type="button">Показать демо-данные</button>
            <button class="btn ghost" id="btnClear" type="button" hidden>Очистить результаты</button>
          </div>
          <div id="status" class="status info" role="status" aria-live="polite" style="margin-top:10px"></div>
          <div class="ftp-progress" id="localProgress" hidden>
            <div class="ftp-progress-track" id="localProgressTrack" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-label="Прогресс анализа" aria-valuetext="ожидание"><div class="ftp-progress-fill" id="localProgressFill"></div></div>
            <div class="ftp-progress-label" id="localProgressLabel"></div>
          </div>
        </div>

        <div class="file-list">
          <div class="file-list-head">
            <span class="label">Выбранные файлы</span>
            <span class="dim" id="fileSummary">0 файлов</span>
          </div>
          <div class="file-items" id="fileItems"></div>
        </div>
      </div>
    </div>
  </section>

  <!-- ===================== FTP live tail ===================== -->
  <section class="panel" id="ftpPanel">
    <div class="panel-head">
      <h2>Источник: FTP</h2>
      <span class="count-pill">живой хвост · инкрементально</span>
      <div class="head-spacer"></div>
      <button class="btn sm ghost" id="ftpToggle" type="button" aria-expanded="false" aria-controls="ftpBody">Показать</button>
    </div>
    <div class="panel-body" id="ftpBody" hidden>
      <div class="ftp-grid">
        <div class="field">
          <label for="ftpHost">Хост</label>
          <input type="text" id="ftpHost" placeholder="ftp.example.com" autocomplete="off" spellcheck="false">
        </div>
        <div class="field">
          <label for="ftpPort">Порт</label>
          <input type="number" id="ftpPort" value="21" min="1" max="65535">
        </div>
        <div class="field">
          <label for="ftpUser">Пользователь</label>
          <input type="text" id="ftpUser" placeholder="anonymous" autocomplete="off" spellcheck="false">
        </div>
        <div class="field">
          <label for="ftpPassword">Пароль</label>
          <input type="password" id="ftpPassword" placeholder="••••••" autocomplete="new-password">
        </div>
        <div class="field wide">
          <label for="ftpPath">Путь к файлу телеметрии</label>
          <input type="text" id="ftpPath" placeholder="/cstrike/addons/hldsmon/logs/hldsmon-{date}.jsonl" spellcheck="false">
        </div>
        <div class="field">
          <label>Соединение</label>
          <label class="ftp-row-check"><input type="checkbox" id="ftpTls"> TLS (FTPS)</label>
        </div>
      </div>
      <div class="ftp-actions">
        <button class="btn primary" id="ftpConnect" type="button">Подключить</button>
        <button class="btn" id="ftpRefresh" type="button" disabled title="Загрузить новые данные (подтянуть хвост файла)">позже →</button>
        <button class="btn ghost" id="ftpLoadEarlier" type="button" disabled title="Подгрузить более старую часть файла (предыдущее окно)">← раньше</button>
        <button class="btn ghost" id="ftpClose" type="button" disabled>Отключить</button>
        <label class="evt-toggle" title="Сохранять хост, логин, пароль и путь в localStorage браузера (локальный инструмент)"><input type="checkbox" id="ftpRemember" checked> сохранять креды</label>
        <div class="ftp-auto">
          <label class="evt-toggle"><input type="checkbox" id="ftpAuto"> авто-обновление</label>
          <label for="ftpInterval">интервал, с</label>
          <input type="number" id="ftpInterval" value="5" min="1" max="3600">
        </div>
      </div>
      <div class="ftp-window-bar">
        <label class="evt-toggle" title="Сколько данных загружать за одно окно (при подключении и на каждый шаг «раньше»)">размер окна
          <select id="ftpWindowSize" aria-label="Размер окна загрузки">
            <option value="300">5 мин</option>
            <option value="900">15 мин</option>
            <option value="1800" selected>30 мин</option>
            <option value="3600">1 ч</option>
            <option value="21600">6 ч</option>
            <option value="86400">24 ч</option>
          </select>
        </label>
        <span class="ftp-range" id="ftpRange" hidden></span>
        <span class="ftp-reached" id="ftpReached" hidden></span>
        <span class="ftp-cap" id="ftpCap" hidden></span>
      </div>
      <div class="ftp-progress" id="ftpProgress" hidden>
        <div class="ftp-progress-track" id="ftpProgressTrack" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-label="Прогресс загрузки" aria-valuetext="ожидание"><div class="ftp-progress-fill" id="ftpProgressFill"></div></div>
        <div class="ftp-progress-label" id="ftpProgressLabel"></div>
      </div>
      <div id="ftpStatus" class="status info" role="status" aria-live="polite"></div>
    </div>
  </section>

  <!-- ===================== Results ===================== -->
  <div id="results" hidden></div>
</main>

<footer>
  <span>HldsMonitoring web-ui · v1</span>
  <span class="dim">Данные обрабатываются локально. Внешние запросы не выполняются.</span>
  <span class="head-spacer" style="flex:1"></span>
  <button class="btn sm ghost" id="btnCollapseAll" type="button">Свернуть всё</button>
  <button class="btn sm ghost" id="btnExpandAll" type="button">Развернуть всё</button>
  <button class="btn sm ghost" id="btnSelfTest" type="button">Самопроверка рендера</button>
</footer>

<div id="toast" aria-live="polite"></div>

<script>
"use strict";
/* =====================================================================
   HldsMonitoring — offline dashboard.
   Single file, no dependencies. Implements the frozen /api contract.
   ===================================================================== */

/* ---------- tiny DOM helpers ---------- */
const $  = (sel, root) => (root || document).querySelector(sel);
const $$ = (sel, root) => Array.from((root || document).querySelectorAll(sel));

function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
}
function svgEl(name, attrs) {
  const n = document.createElementNS("http://www.w3.org/2000/svg", name);
  if (attrs) for (const k in attrs) n.setAttribute(k, attrs[k]);
  return n;
}

/* ---------- formatting ---------- */
const nfRu = new Intl.NumberFormat("ru-RU");
const nfRu2 = new Intl.NumberFormat("ru-RU", { minimumFractionDigits: 2, maximumFractionDigits: 2 });

function isNum(v) { return typeof v === "number" && isFinite(v); }
function fmtInt(v) {
  if (!isNum(v)) return "—";
  return nfRu.format(Math.round(v));
}
let _fmtCache = null;
function fmtFloat(v, d) {
  if (!isNum(v)) return "—";
  if (d == null) return nfRu2.format(v);
  if (!_fmtCache) _fmtCache = {};
  if (!_fmtCache[d]) _fmtCache[d] = new Intl.NumberFormat("ru-RU", { minimumFractionDigits: d, maximumFractionDigits: d });
  return _fmtCache[d].format(v);
}
function fmtDuration(s) {
  if (!isNum(s)) return "—";
  s = Math.round(s);
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
  const parts = [];
  if (h) parts.push(h + "ч");
  if (m || h) parts.push(m + "м");
  parts.push(sec + "с");
  return parts.join(" ");
}
function fmtIso(epoch) {
  if (!isNum(epoch)) return "—";
  return new Date(epoch * 1000).toISOString().replace(".000", "").replace("T", " ").replace("Z", " UTC");
}

/* Period range text: seconds precision, rendered in the BROWSER timezone

   `fmtIso` (UTC) readouts elsewhere in the page. */

}

    day: "2-digit", month: "2-digit", year: "numeric",
    hour: "2-digit", minute: "2-digit", second: "2-digit",
    hour12: false, timeZone: tz,
  }, withName ? { timeZoneName: "short" } : null));
  try {
    return mk(rangeTimeZone(), true).format(d);
  } catch (e) {
    try { return mk(rangeTimeZone(), false).format(d); }        // timeZoneName unsupported
    catch (e2) {

}

  let i = 0, x = n;
  while (x >= 1024 && i < u.length - 1) { x /= 1024; i++; }
  return fmtFloat(x, i === 0 ? 0 : 1) + " " + u[i];
}

/* ---------- period parsing + filtered view ---------- */
function inRangeF(v, lo, hi) { return isNum(v) && v >= lo && v <= hi; }

  if (!Array.isArray(arr)) return idx.map(() => null);
  return idx.map(i => arr[i]);
}
function seriesIndices(t, lo, hi) {
  const out = [];
  if (!Array.isArray(t)) return out;

    if (lo == null || v < lo) lo = v;
    if (hi == null || v > hi) hi = v;

  return { start: lo, end: hi };
}
function aggregateSeries(cs) {
  const t = (cs && Array.isArray(cs.t)) ? cs.t : [];
  const stat = (name) => {
    const arr = (cs && Array.isArray(cs[name])) ? cs[name] : [];
    let n = 0, sum = 0, max = null;
    for (let i = 0; i < t.length; i++) {
      const v = arr[i];
      if (isNum(v)) { n++; sum += v; if (max == null || v > max) max = v; }
    }
    return { avg: n ? sum / n : null, max: max };
  };
  const ping = stat("ping"), loss = stat("loss"), choke = stat("choke"), fill = stat("rel_fill");
  return {
    samples: t.length,
    ping_avg: ping.avg, ping_max: ping.max,
    loss_avg: loss.avg, loss_max: loss.max,
    choke_avg: choke.avg, choke_max: choke.max,
    rel_fill_max: fill.max,

}
function identityColumns(ident) {
  ident = ident || {};
  return {
    name: ident.name || "", authid: ident.authid || "",
    steamid64: ident.steamid64 || "", ip: ident.ip || "",
    port: isNum(ident.port) ? ident.port : null,
    slot: isNum(ident.slot) ? ident.slot : null,
    userid: isNum(ident.userid) ? ident.userid : null,
    conn_s: isNum(ident.conn_s) ? ident.conn_s : null,
    fake: ident.fake === true, proxy: ident.proxy === true,
  };
}

const NON_IDENTIFYING_AUTHIDS = { "": 1, "BOT": 1, "STEAM_ID_LAN": 1, "STEAM_ID_PENDING": 1, "VALVE_ID_LAN": 1, "UNKNOWN": 1 };
function playerKeyOf(id) {
  id = id || {};
  if (id.steamid64) return id.steamid64;
  const auth = id.authid;
  if (auth && !NON_IDENTIFYING_AUTHIDS[auth]) return auth;
  return id.session || null;
}
function buildPlayerGroups(identities) {
  identities = identities || {};
  const groups = {};
  for (const s of Object.keys(identities)) {
    const id = identities[s] || {};
    const k = playerKeyOf(id);
    if (!k) continue;
    let g = groups[k];
    if (!g) g = groups[k] = { player: k, steamid64: "", authid: "", name: "", sessions: [], first_t: null, last_t: null };
    if (id.steamid64) g.steamid64 = id.steamid64;
    if (id.authid) g.authid = id.authid;
    if (id.name) g.name = id.name;
    g.sessions.push(s);
    if (isNum(id.first_t) && (g.first_t == null || id.first_t < g.first_t)) g.first_t = id.first_t;
    if (isNum(id.last_t) && (g.last_t == null || id.last_t > g.last_t)) g.last_t = id.last_t;
  }
  for (const k in groups) {
    groups[k].sessions.sort((a, b) => {
      const fa = isNum(identities[a] && identities[a].first_t) ? identities[a].first_t : Infinity;
      const fb = isNum(identities[b] && identities[b].first_t) ? identities[b].first_t : Infinity;
      return fa - fb || String(a).localeCompare(String(b));
    });
  }
  return groups;
}

/* mergeSessions: union the keys across a player's per-session parallel series
   and concatenate each array in session order (missing value -> null). Sessions
   are non-overlapping and already sorted by first_t, so `t` stays ascending. */
function mergeSessions(listOfSeries) {
  const list = (listOfSeries || []).filter(s => s && typeof s === "object");
  const keys = {};
  for (const s of list) for (const k in s) keys[k] = true;
  const out = {};
  for (const k in keys) {
    const arr = [];
    for (const s of list) {
      const n = Array.isArray(s.t) ? s.t.length : 0;
      const src = Array.isArray(s[k]) ? s[k] : null;
      for (let i = 0; i < n; i++) arr.push(src && src[i] !== undefined ? src[i] : null);
    }
    out[k] = arr;
  }
  return out;
}

/* computeView: derive the period-filtered render model from a raw result. */
function computeView(result) {
  result = result || {};
  const from = state.period.from, to = state.period.to;
  const lo = isNum(from) ? from : -Infinity;
  const hi = isNum(to) ? to : Infinity;
  const active = isNum(from) || isNum(to);

  const rawSeries = result.series || {};
  const sIdx = seriesIndices(rawSeries.t, lo, hi);
  const series = {};
  for (const k in rawSeries) series[k] = sliceByIdx(rawSeries[k], sIdx);

  const rawCS = result.client_series || {};
  const clientSeries = {};
  for (const id in rawCS) {
    const c = rawCS[id] || {};
    const idx = seriesIndices(c.t, lo, hi);
    const o = {};
    for (const k in c) o[k] = sliceByIdx(c[k], idx);
    clientSeries[id] = o;
  }

  const rawHost = result.host_series || {};
  const hIdx = seriesIndices(rawHost.t, lo, hi);
  const hostSeries = {};
  for (const k in rawHost) hostSeries[k] = sliceByIdx(rawHost[k], hIdx);

  const config = (Array.isArray(result.config) ? result.config : [])
    .filter(c => !active || inRangeF(c.t, lo, hi));

  const drops = (Array.isArray(result.drops) ? result.drops : [])
    .filter(d => !active || inRangeF(d.t, lo, hi));

  const events = (Array.isArray(result.events) ? result.events : [])
    .filter(w => {
      if (!active) return true;
      const s = isNum(w.start) ? w.start : -Infinity;
      const e = isNum(w.end) ? w.end : Infinity;
      return s <= hi && e >= lo;
    });

  const identities = result.client_identities || {};
  const sessions = new Set(Object.keys(clientSeries));
  Object.keys(identities).forEach(k => sessions.add(k));
  // fall back to pre-aggregated clients when the analyzer provided no series
  if (!Object.keys(clientSeries).length && Array.isArray(result.clients)) {
    result.clients.forEach(c => { if (c && c.session != null) sessions.add(String(c.session)); });
  }
  const links = sessionLinks(result);
  const clients = [];
  sessions.forEach(session => {
    const cs = clientSeries[session];
    const idn = identities[session] || {};
    const agg = cs ? aggregateSeries(cs) : (findAggregate(result.clients, session) || aggregateSeries({}));
    const link = links[String(session)];
    clients.push(Object.assign(
      { session: session, run: isNum(idn.run) ? idn.run : null, id: idn.id != null ? idn.id : null },
      identityColumns(idn),
      { first_t: idn.first_t, last_t: idn.last_t, linkCount: link ? link.count : 1, player: link ? link.player : null },
      agg));
  });
  const multiRun = clients.some(c => isNum(c.run) && c.run > 0);
  clients.forEach(c => { c.multiRun = multiRun; });
  clients.sort((a, b) => {
    const ra = isNum(a.run) ? a.run : 0, rb = isNum(b.run) ? b.run : 0;
    if (ra !== rb) return ra - rb;
    const sa = isNum(a.slot) ? a.slot : Infinity, sb = isNum(b.slot) ? b.slot : Infinity;
    if (sa !== sb) return sa - sb;
    const ia = isNum(a.id) ? a.id : Infinity, ib = isNum(b.id) ? b.id : Infinity;
    if (ia !== ib) return ia - ib;
    return String(a.session).localeCompare(String(b.session));
  });

  const sT = series.t || [];
  const sRange = rangeOf(sT);
  const tRange = {
    start: sRange.start != null ? sRange.start : (active && isNum(from) ? from : null),
    end: sRange.end != null ? sRange.end : (active && isNum(to) ? to : null),
  };
  // fullRange = the WHOLE-log range (brush domain). With the server-side
  // period a windowed response only carries the window's series, so prefer the
  // whole-range captured from the coarse overview (state.fullRange).
  const fullS = rangeOf(rawSeries.t || []);
  const fullRange = (state.fullRange && isNum(state.fullRange.start))
    ? state.fullRange
    : { start: fullS.start, end: fullS.end };
  let clientSamples = 0;
  Object.keys(clientSeries).forEach(id => { clientSamples += (clientSeries[id].t || []).length; });

  // player-level (by SteamID): merge a player's sessions into one series
  const playerGroups = (result && result.sessions) || {};
  const players = [];
  for (const pk in playerGroups) {
    const g = playerGroups[pk] || {};
    const sessions = (Array.isArray(g.sessions) ? g.sessions : []).map(sk => {
      const idn = identities[sk] || {};
      const sid = String(sk);
      const cs = clientSeries[sid];
      return {
        session: sid,
        slot: isNum(idn.slot) ? idn.slot : null,
        id: idn.id != null ? idn.id : null,
        userid: isNum(idn.userid) ? idn.userid : null,
        run: isNum(idn.run) ? idn.run : null,
        name: idn.name || "",
        first_t: idn.first_t,
        last_t: idn.last_t,
        samples: isNum(idn.samples) ? idn.samples : ((cs && cs.t) ? cs.t.length : 0),
        fake: idn.fake === true,
        proxy: idn.proxy === true,
      };
    });
    sessions.sort((a, b) => {
      const fa = isNum(a.first_t) ? a.first_t : Infinity;
      const fb = isNum(b.first_t) ? b.first_t : Infinity;
      return fa - fb || String(a.session).localeCompare(String(b.session));
    });
    const merged = mergeSessions(sessions.map(s => clientSeries[s.session]));
    let firstT = isNum(g.first_t) ? g.first_t : null;
    let lastT = isNum(g.last_t) ? g.last_t : null;
    let samples = 0;
    for (const s of sessions) {
      samples += isNum(s.samples) ? s.samples : 0;
      if (isNum(s.first_t) && (firstT == null || s.first_t < firstT)) firstT = s.first_t;
      if (isNum(s.last_t) && (lastT == null || s.last_t > lastT)) lastT = s.last_t;
    }
    // merged `series` above is built in chronological order (first_t); only the
    // DISPLAY list is re-sorted by userid (chips/options), so the overlay stays continuous.
    sessions.sort(byUserId);
    players.push({
      player: pk,
      steamid64: g.steamid64 || "",
      authid: g.authid || "",
      name: g.name || "",
      sessions,
      series: merged,
      first_t: firstT,
      last_t: lastT,
      samples,
    });
  }
  players.sort((a, b) => {
    const fa = isNum(a.first_t) ? a.first_t : Infinity;
    const fb = isNum(b.first_t) ? b.first_t : Infinity;
    return fa - fb || String(a.player).localeCompare(String(b.player));
  });

  return {
    result, series, clientSeries, hostSeries, config,
    drops, events, clients, identities, players,
    active, lo, hi, tRange, fullRange,
    serverSamples: sIdx.length, clientSamples,
  };
}
function findAggregate(clients, session) {
  if (!Array.isArray(clients)) return null;
  const hit = clients.find(c => c && String(c.session) === String(session));
  return hit || null;
}
function sessionLinks(result) {
  const out = {};
  const groups = (result && result.sessions) || {};
  for (const pk in groups) {
    const g = groups[pk] || {};
    const list = Array.isArray(g.sessions) ? g.sessions : [];
    if (list.length > 1) for (const s of list) out[String(s)] = { count: list.length, player: pk };
  }
  return out;
}

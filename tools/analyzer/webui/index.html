    sWrap.hidden = false;
    sWrap.appendChild(el("span", "player-sessions-label", "Сессии:"));
    for (const s of p.sessions.slice().sort(byUserId)) {
      const btn = el("button", "session-chip", sessionChipLabel(s));
      btn.type = "button";
      btn.dataset.session = String(s.session);
      btn.title = (isNum(s.first_t) ? fmtIso(s.first_t) : "—") + " → " + (isNum(s.last_t) ? fmtIso(s.last_t) : "—");
      btn.addEventListener("click", () => selectClient(s.session, btn));
      sWrap.appendChild(btn);
    }
    markSessionChips();
  }
  tools.appendChild(sWrap);

  /* ---- per-metric checkboxes for the selected player (PER-PLAYER set, title = note) ---- */
  const pmWrap = el("div", "ds-legend");
  pmWrap.id = "playerMetrics";
  function renderPlayerMetrics() {
    pmWrap.textContent = "";
    const p = selectedPlayer(state.view || view);
    if (!p) {
      pmWrap.appendChild(el("span", "hint", "выберите игрока"));
      return;
    }
    const c = p.series;
    for (const m of PLAYER_METRICS) {
      if (!c || !anyNum(c[m.key])) continue;
      const lab = el("label", "evt-toggle");
      if (METRIC_NOTES[m.key]) lab.title = METRIC_NOTES[m.key];
      const cb = el("input");
      cb.type = "checkbox";
      cb.checked = state.playerMetrics.indexOf(m.key) !== -1;
      cb.addEventListener("change", () => {
        const arr = state.playerMetrics;
        const i = arr.indexOf(m.key);
        if (cb.checked && i === -1) arr.push(m.key);
        else if (!cb.checked && i !== -1) arr.splice(i, 1);
        datasetsSave();
        fillAllChart(host, state.view);
      });
      const sw = el("i", "swatch");
      sw.style.background = m.color;
      if (METRIC_NOTES[m.key]) sw.title = METRIC_NOTES[m.key];
      lab.appendChild(cb);
      lab.appendChild(sw);
      lab.appendChild(document.createTextNode(" " + m.label));
      pmWrap.appendChild(lab);
    }
  }
  renderPlayerMetrics();
  renderPlayerSessions();
  tools.appendChild(pmWrap);

  /* let drop rows / the global client picker refresh chips + metric boxes in place */
  refreshAllPanelUI = () => {
    renderPlayerMetrics();
    renderPlayerSessions();
    syncClientPickers();
  };

  const nLabel = el("label", "evt-toggle");
  nLabel.title = "Нормировать каждый ряд к 0–100%, чтобы сравнить форму кривых";
  const nCb = el("input");
  nCb.type = "checkbox"; nCb.checked = state.allNormalize;
  nCb.addEventListener("change", () => { state.allNormalize = nCb.checked; datasetsSave(); fillAllChart(host, state.view); });
  nLabel.appendChild(nCb);
  nLabel.appendChild(document.createTextNode(" нормализовать"));
  tools.appendChild(nLabel);

  const eLabel = el("label", "evt-toggle");
  eLabel.title = "Рисовать полосы событий (смена карты, выключение, краш, прогрев)";
  const eCb = el("input");
  eCb.type = "checkbox"; eCb.checked = state.showEvents;
  eCb.setAttribute("data-events-toggle", "");
  eCb.addEventListener("change", () => { state.showEvents = eCb.checked; datasetsSave(); applyShowEvents(); });
  eLabel.appendChild(eCb);
  eLabel.appendChild(document.createTextNode(" показывать события"));
  tools.appendChild(eLabel);

  /* ---- «Справка»: compact metric -> note list (persisted open/closed) ---- */
  const helpWrap = el("div", "metric-help");
  helpWrap.hidden = !state.datasetsHelpOpen;
  const helpList = el("div", "metric-help-list");
  for (const d of ALL_DATASETS.concat(HOST_DATASETS, PLAYER_METRICS)) {
    if (!METRIC_NOTES[d.key]) continue;
    const row = el("div", "metric-help-row");
    row.appendChild(el("span", "metric-help-key", d.label));
    row.appendChild(el("span", "metric-help-note", METRIC_NOTES[d.key]));
    helpList.appendChild(row);
  }
  helpWrap.appendChild(helpList);

  const helpBtn = el("button", "btn sm ghost", "Справка");
  helpBtn.type = "button";
  helpBtn.title = "Показать примечания ко всем метрикам";
  helpBtn.setAttribute("aria-expanded", state.datasetsHelpOpen ? "true" : "false");
  helpBtn.addEventListener("click", () => {
    state.datasetsHelpOpen = !state.datasetsHelpOpen;
    helpWrap.hidden = !state.datasetsHelpOpen;
    helpBtn.setAttribute("aria-expanded", state.datasetsHelpOpen ? "true" : "false");
    datasetsSave();
  });
  tools.appendChild(helpBtn);

  const bodyWrap = el("div");
  bodyWrap.appendChild(host);
  bodyWrap.appendChild(helpWrap);

  const p = panel("Все датасеты", null, bodyWrap, tools);
  p.id = "allDatasetsPanel";
  return p;
}

function lineFmtValue(l, spec, v) {
  const f = l.fmt || spec.fmt;
  const u = l.unit != null ? l.unit : spec.unit;
  const s = f(v);
  return u ? s + " " + u : s;
}

function buildChart(t, spec, opts) {
  opts = opts || {};
  const events = Array.isArray(opts.events) ? opts.events : [];
  const showEvents = opts.showEvents !== false;
  const normalize = !!opts.normalize;
  const bars = !!spec.bars;
  const card = el("div", "chart");

  /* head + legend */
  const head = el("div", "chart-head");
  const title = el("div", "chart-title");
  title.appendChild(document.createTextNode(spec.title));
  if (spec.unit) { const u = el("span", "unit", "  ·  " + spec.unit); title.appendChild(u); }
  head.appendChild(title);
  const legend = el("div", "legend");
  for (const l of spec.lines) {
    const it = el("span", "legend-item");
    const sw = el("i", "swatch");
    sw.style.background = l.color;
    it.appendChild(sw);
    it.appendChild(document.createTextNode(l.name));
    legend.appendChild(it);
  }
  head.appendChild(legend);
  card.appendChild(head);

  const plot = el("div", "chart-plot");
  card.appendChild(plot);

  const n = t.length;
  const svg = svgEl("svg", { viewBox: "0 0 " + CH_W + " " + CH_H, class: "chart-svg", role: "img", "aria-label": spec.title });
  plot.appendChild(svg);

  /* per-line plotted values (normalized independently; raw kept for the tooltip) */
  const plotVals = spec.lines.map(l => {
    const raw = l.values || [];
    if (!normalize) return raw;
    let mn = Infinity, mx = -Infinity;
    for (const v of raw) if (isNum(v)) { if (v < mn) mn = v; if (v > mx) mx = v; }
    if (!isFinite(mn)) return raw.map(() => null);
    if (mx === mn) return raw.map(v => isNum(v) ? 0.5 : null);
    return raw.map(v => isNum(v) ? (v - mn) / (mx - mn) : null);
  });

  /* y range (from plotted values) */
  let ymin = Infinity, ymax = -Infinity;
  for (const vals of plotVals) {
    for (const v of vals) { if (isNum(v)) { if (v < ymin) ymin = v; if (v > ymax) ymax = v; } }
  }
  if (!isFinite(ymin)) { ymin = 0; ymax = 1; }
  if (normalize) { ymin = 0; ymax = 1; }
  else if (bars) {
    let mc = 0;
    for (const vals of plotVals) for (const v of vals) if (isNum(v) && v > mc) mc = v;
    ymin = 0; ymax = Math.max(1, Math.ceil(mc));
  }
  else if (ymin === ymax) { const p = Math.abs(ymin) * 0.1 || 1; ymin -= p; ymax += p; }
  else { const p = (ymax - ymin) * 0.08; ymin -= p; ymax += p; }
  if (spec.zeroBase && ymin > 0) ymin = 0;

  const t0 = t[0], t1 = t[n - 1];
  const sx = tt => (t1 > t0) ? (CH_M.l + ((tt - t0) / (t1 - t0)) * PLOT_W) : (CH_M.l + PLOT_W / 2);
  const sy = v => CH_M.t + (1 - (v - ymin) / (ymax - ymin)) * PLOT_H;

  /* event bands (behind grid + lines) */
  if (showEvents && events.length) {
    const bands = svgEl("g", { class: "event-bands" });
    const lo = Math.min(t0, t1), hi = Math.max(t0, t1);
    for (const w of events) {
      if (!isNum(w.start) || !isNum(w.end)) continue;
      const s = Math.max(w.start, lo), e = Math.min(w.end, hi);
      if (e <= s) continue;
      const x1 = sx(s), x2 = sx(e);
      bands.appendChild(svgEl("rect", {
        x: x1, y: CH_M.t, width: Math.max(0.5, x2 - x1), height: PLOT_H,
        fill: BAND_COLORS[w.kind] || BAND_COLORS.warmup, "fill-opacity": "0.16",
      }));
    }
    svg.appendChild(bands);
  }

  /* grid + y labels */
  const grid = svgEl("g", { class: "grid" });
  const TICKS = bars ? (ymax <= 6 ? Math.max(1, Math.round(ymax)) : 4) : 4;
  for (let i = 0; i <= TICKS; i++) {
    const val = ymin + (ymax - ymin) * (i / TICKS);
    const y = sy(val);
    const ln = svgEl("line", { x1: CH_M.l, y1: y, x2: CH_M.l + PLOT_W, y2: y });
    if (i === 0) ln.setAttribute("class", "base");
    grid.appendChild(ln);
    const tx = svgEl("text", { x: CH_M.l - 9, y: y + 3.5, "text-anchor": "end" });
    tx.textContent = spec.fmt(val);
    grid.appendChild(tx);
  }
  svg.appendChild(grid);

  /* x axis labels */
  const axis = svgEl("g", { class: "axis" });
  const xLabels = [
    { x: CH_M.l, anchor: "start", txt: fmtClock(t0) },
    { x: CH_M.l + PLOT_W / 2, anchor: "middle", txt: fmtClock((t0 + t1) / 2) },
    { x: CH_M.l + PLOT_W, anchor: "end", txt: fmtClock(t1) },
  ];
  for (const xl of xLabels) {
    const tx = svgEl("text", { x: xl.x, y: CH_H - 10, "text-anchor": xl.anchor });
    tx.textContent = xl.txt;
    axis.appendChild(tx);
  }
  svg.appendChild(axis);

  /* x pixel coords */
  const xs = new Array(n);
  for (let i = 0; i < n; i++) xs[i] = sx(t[i]);

  if (bars) {
    /* count bars: width derived from the bucket spacing */
    const spacing = (n > 1 && t1 > t0) ? ((t[1] - t[0]) / (t1 - t0)) * PLOT_W : PLOT_W;
    const barW = Math.max(1.5, Math.min(spacing * 0.8, 46));
    const barsG = svgEl("g", { class: "bars" });
    const vals = plotVals[0] || [];
    const baseY = sy(ymin);
    for (let i = 0; i < n; i++) {
      const v = vals[i];
      if (!isNum(v) || v <= 0) continue;
      const y = sy(v);
      let bx = xs[i] - barW / 2;
      if (bx < CH_M.l) bx = CH_M.l;
      if (bx + barW > CH_M.l + PLOT_W) bx = CH_M.l + PLOT_W - barW;
      barsG.appendChild(svgEl("rect", {
        x: bx, y: y, width: barW, height: Math.max(0.5, baseY - y),
        fill: spec.lines[0].color, rx: 1.5,
      }));
    }
    svg.appendChild(barsG);
  } else {
    /* line paths (null breaks the line) + caveat ring markers */
    const linesG = svgEl("g");
    for (let li = 0; li < spec.lines.length; li++) {
      const vals = plotVals[li] || [];
      let d = "", pen = false;
      for (let i = 0; i < n; i++) {
        const v = vals[i];
        if (!isNum(v)) { pen = false; continue; }
        const x = xs[i], y = sy(v);
        if (!pen) { d += "M" + x.toFixed(1) + " " + y.toFixed(1) + " "; pen = true; }
        else { d += "L" + x.toFixed(1) + " " + y.toFixed(1) + " "; }
      }
      linesG.appendChild(svgEl("path", { class: "spark", d: d, stroke: spec.lines[li].color }));
      const marks = spec.lines[li].markers;
      if (Array.isArray(marks)) {
        for (let i = 0; i < n; i++) {
          if (!marks[i] || !isNum(vals[i])) continue;
          const mark = svgEl("circle", {
            class: "caveat-marker", cx: xs[i].toFixed(1), cy: sy(vals[i]).toFixed(1), r: 2.8,
          });
          const title = svgEl("title");
          title.textContent = (spec.lines[li].markerNote || "⚠ caveated") + " · " + fmtIso(t[i]);
          mark.appendChild(title);
          linesG.appendChild(mark);
        }
      }
    }
    svg.appendChild(linesG);
  }

  /* hover layer */
  const hoverLine = svgEl("line", { class: "hover-line", x1: 0, y1: CH_M.t, x2: 0, y2: CH_M.t + PLOT_H });
  svg.appendChild(hoverLine);
  const dots = spec.lines.map(l => {
    const c = svgEl("circle", { class: "hover-dot", r: 3.4, fill: l.color });
    svg.appendChild(c);
    return c;
  });
  const tip = el("div", "chart-tip");
  card.appendChild(tip);

  /* nearest index by time */
  function nearestIndex(viewX) {
    if (viewX <= CH_M.l) return 0;
    if (viewX >= CH_M.l + PLOT_W) return n - 1;
    const target = t0 + ((viewX - CH_M.l) / PLOT_W) * (t1 - t0);
    let lo = 0, hi = n - 1;
    while (lo < hi) {
      const mid = (lo + hi) >> 1;
      if (t[mid] < target) lo = mid + 1; else hi = mid;
    }
    if (lo > 0 && Math.abs(t[lo - 1] - target) <= Math.abs(t[lo] - target)) return lo - 1;
    return lo;
  }

  function hideHover() {
    hoverLine.style.opacity = "0";
    dots.forEach(d => { d.style.opacity = "0"; });
    tip.style.opacity = "0";
  }

  plot.addEventListener("mousemove", (ev) => {
    const rect = svg.getBoundingClientRect();
    if (!rect.width) return;
    const frac = (ev.clientX - rect.left) / rect.width;
    const viewX = frac * CH_W;
    const idx = nearestIndex(viewX);
    const x = xs[idx];

    hoverLine.setAttribute("x1", x);
    hoverLine.setAttribute("x2", x);
    hoverLine.style.opacity = "0.7";

    let linesHtml = "";
    spec.lines.forEach((l, li) => {
      const raw = (l.values || [])[idx];
      const pv = (plotVals[li] || [])[idx];
      const dot = dots[li];
      if (isNum(raw) && isNum(pv)) {
        dot.setAttribute("cx", x);
        dot.setAttribute("cy", sy(pv));
        dot.style.opacity = "1";
        const caveat = (Array.isArray(l.markers) && l.markers[idx])
          ? "<span class='tt-note'>⚠ caveated</span>" : "";
        linesHtml += "<div class='tt-row'><i class='swatch' style='background:" + l.color + "'></i><span class='tt-name'>" + l.name + "</span><span class='tt-val'>" + lineFmtValue(l, spec, raw) + "</span>" + caveat + "</div>";
      } else {
        dot.style.opacity = "0";
      }
    });

    let timeTxt = fmtIso(t[idx]);
    if (bars) {
      const bstep = isNum(spec.bucketStep) ? spec.bucketStep : (n > 1 ? (t[1] - t[0]) : 0);
      timeTxt = fmtIso(t[idx] - bstep / 2) + " — " + fmtClock(t[idx] + bstep / 2);
    }
    tip.innerHTML = "<div class='tt-time'>" + timeTxt + "</div>" + linesHtml;
    tip.style.opacity = "1";
    // Clamp against the CARD (the tooltip's offset parent), using the measured width
    // so a wide tooltip never overflows the card nor spawns a horizontal scrollbar.
    const cardRect = card.getBoundingClientRect();
    const tipW = tip.offsetWidth;
    const pad = 6;
    const min = tipW / 2 + pad;
    const max = Math.max(min, cardRect.width - tipW / 2 - pad);
    const left = (max <= min)
      ? cardRect.width / 2
      : Math.max(min, Math.min(max, ev.clientX - cardRect.left));
    tip.style.left = left + "px";
  });
  plot.addEventListener("mouseleave", hideHover);

  return card;
}

/* =====================================================================
   Top-level render
   ===================================================================== */
/* syncTopbarHeight: keep --topbar-h in step with the topbar's measured height
   (it can wrap / change with badges) so sticky panels sit flush beneath it. */
function syncTopbarHeight() {
  const tb = $(".topbar");
  if (tb) document.documentElement.style.setProperty("--topbar-h", tb.offsetHeight + "px");
}

function render(result) {
  if (!result) return;
  // Capture keyboard focus before tearing the DOM down, restore it afterwards.
  const focusId = document.activeElement && document.activeElement.id;
  state.result = result;
  const view = computeView(result);
  state.view = view;
  const results = $("#results");
  results.hidden = false;
  results.textContent = "";

  const digest = result.digest || {};

  setLogEndBadge(result.log_end);

  // 1. summary (period-aware)
  results.appendChild(buildSummary(result, view));

  // 2. period selector
  results.appendChild(buildPeriodPanel(result));

  // 3. anomalies counter + log-end line
  results.appendChild(buildInfoLine(result));

  // 4. combined "all datasets" overlay chart — FIRST data panel
  results.appendChild(buildAllPanel(view));

  // 5. focus events (result.focus_points) — right after the combined panel
  results.appendChild(buildFocusPanel(view, result));

  // 6. counts by type
  results.appendChild(panel("Записи по типам", String(digest.records != null ? digest.records : (result.records_count || 0)) + " всего", buildTypes(digest.counts_by_type)));

  // 6b. config snapshots + diffs (stage 10)
  results.appendChild(buildConfigPanel(view, result));

  // 7. server charts (with event bands)
  results.appendChild(buildChartsPanel(view));

  // 8. per-client charts + picker
  results.appendChild(buildPerClientPanel(view));

  // 9. clients table (identity + period aggregates)
  results.appendChild(buildClientsPanel(view));

  // 10. drops over time (count bars) + drops table + incident bundle
  results.appendChild(buildDropsChartPanel(view));
  const bundleMins = el("input");
  bundleMins.type = "number";
  bundleMins.id = "bundleMins";
  bundleMins.className = "bundle-mins";
  bundleMins.min = "0";
  bundleMins.max = "1440";
  bundleMins.step = "1";
  bundleMins.value = "2";
  bundleMins.title = "Полуокно bundle вокруг drop, минут";
  const minsLabel = el("label", "evt-toggle", "± мин ");
  minsLabel.appendChild(bundleMins);
  const bundleBtn = el("button", "btn sm ghost", "bundle");
  bundleBtn.type = "button";
  bundleBtn.title = "Скачать JSON-конверт инцидента (окно ±N мин) для последнего drop в периоде";
  bundleBtn.disabled = state.demo || !state.handle;
  bundleBtn.addEventListener("click", () => {
    const drops = (view && Array.isArray(view.drops)) ? view.drops : [];
    if (!drops.length) { toast("Нет drop в выбранном периоде.", "error"); return; }
    const mins = parseFloat(bundleMins.value);
    downloadBundle(drops[drops.length - 1], isNaN(mins) ? 2 : mins);
  });
  const dropTools = el("div", "head-tools");
  dropTools.appendChild(minsLabel);
  dropTools.appendChild(bundleBtn);
  results.appendChild(panel("Отключения (drops)", fmtInt(view.drops.length) + " шт.", buildDropsPanel(view.drops), dropTools));

  // 11. anomalies
  results.appendChild(panel("Аномалии", null, buildAnomalies(result.anomalies)));

  setModeBadge(!!state.demo);
  setExportEnabled(!state.demo && !!state.handle);
  $("#btnClear").hidden = false;
  syncTopbarHeight();

  // Restore keyboard focus to the previously focused control (if it survived the rebuild).
  if (focusId) {
    const again = document.getElementById(focusId);
    if (again) { try { again.focus(); } catch (e) { /* element may be gone */ } }
  }
}

function panel(titleText, pillText, bodyEl, headExtra) {
  const p = el("section", "panel");
  const key = "p:" + titleText;
  let collapsed = !!state.collapsed[key];
  if (collapsed) p.classList.add("collapsed");

  const head = el("div", "panel-head");

  // clickable title control (chevron + h2 + count-pill); toggles the body only
  const toggle = el("div", "panel-toggle");
  toggle.setAttribute("role", "button");
  toggle.tabIndex = 0;
  toggle.setAttribute("aria-expanded", collapsed ? "false" : "true");
  const chev = el("span", "chevron", collapsed ? "▸" : "▾");
  const h2 = el("h2", null, titleText);
  toggle.appendChild(chev);
  toggle.appendChild(h2);
  if (pillText) toggle.appendChild(el("span", "count-pill", pillText));
  const toggleBody = () => {
    collapsed = !collapsed;
    p.classList.toggle("collapsed", collapsed);
    toggle.setAttribute("aria-expanded", collapsed ? "false" : "true");
    chev.textContent = collapsed ? "▸" : "▾";
    state.collapsed[key] = collapsed;   // persists across re-renders
    collapsedSave();                    // persists across page reloads
  };
  toggle.addEventListener("click", toggleBody);
  toggle.addEventListener("keydown", (e) => {
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggleBody(); }
  });
  head.appendChild(toggle);

  if (headExtra) {
    if (Array.isArray(headExtra)) headExtra.forEach(n => { if (n) head.appendChild(n); });
    else head.appendChild(headExtra);
  }
  p.appendChild(head);
  const body = el("div", "panel-body");
  body.appendChild(bodyEl);
  p.appendChild(body);
  return p;
}

/* =====================================================================
   Demo dataset — rendered through the exact same path.
   ===================================================================== */
function makeDemo() {
  const N = 60, t0 = 1712345678, dt = 1.0;
  const N1 = 30, t1 = t0 + (N - 1) * dt + 5;
  const run0End = t0 + (N - 1) * dt;
  const run1End = t1 + (N1 - 1) * dt;
  const t = [], frameMin = [], frameAvg = [], frameMax = [];
  const fps = [], cpu = [], rss = [], players = [], real = [], edicts = [], inK = [], outK = [];
  for (let i = 0; i < N; i++) {
    const s = Math.sin(i / 6);
    const s2 = Math.sin(i / 3 + 1);
    t.push(t0 + i * dt);
    const base = 3.0 + 0.6 * s2;
    frameMin.push(+Math.max(1, base - 0.8).toFixed(2));
    frameAvg.push(+(base + 0.6).toFixed(2));
    frameMax.push(+(base + (i % 9 === 0 ? 44 + 10 * s2 : 3 + 2 * Math.abs(s))).toFixed(2));
    fps.push(+(99 + s * 1.5).toFixed(1));
    cpu.push(+(38 + 12 * s).toFixed(1));
    rss.push(Math.round(118000 + i * 90 + 800 * Math.abs(s2)));
    const p = Math.round(16 + 3 * s);
    players.push(p);
    real.push(p - 1);
    edicts.push(Math.round(220 + 20 * Math.abs(s2)));
    inK.push(+(760 + 120 * s).toFixed(1));
    outK.push(+(1350 + 180 * s2).toFixed(1));
  }

  /* per-client parallel series (own timestamps, a few nulls) */
  const mkSeries = (prof, count, tStart) => {
    count = count || N;
    tStart = tStart == null ? t0 : tStart;
    const o = { t: [], ping: [], loss: [], choke: [], rel_fill: [], dloss: [], delta_seq: [], idle_ms: [], flow_in_kbps: [], flow_out_kbps: [] };
    const flowIn = prof.flowIn != null ? prof.flowIn : 8;
    const flowInAmp = prof.flowInAmp != null ? prof.flowInAmp : 3;
    const flowOut = prof.flowOut != null ? prof.flowOut : 20;
    const flowOutAmp = prof.flowOutAmp != null ? prof.flowOutAmp : 7;
    for (let i = 0; i < count; i++) {
      const s = Math.sin(i / 5 + prof.ph);
      o.t.push(tStart + i * dt);
      o.ping.push(+(prof.ping + prof.pingAmp * s + (i % 13 === 0 ? prof.spike : 0)).toFixed(1));
      o.loss.push(+(prof.loss + prof.lossAmp * Math.abs(Math.sin(i / 7))).toFixed(1));
      o.choke.push(+(Math.max(0, prof.choke + prof.chokeAmp * Math.abs(s))).toFixed(1));
      let fill = prof.fill + (prof.fillGrow ? prof.fillGrow * (i / count) : 0) + 2 * Math.abs(s);
      o.rel_fill.push(+Math.min(100, fill).toFixed(1));
      o.dloss.push(i % 20 === 0 ? 1 : 0);
      o.delta_seq.push(i % 9 === 0 ? (prof.gap || 3) : 0);
      // idle_ms: baseline jitter, ramping up near the end for a client that goes silent.
      const idleBase = prof.idleBase || 0;
      let idle = idleBase + (i % 11 === 0 ? (prof.idleJitter || 0) : 0);
      if (prof.idleEnd && i >= count - prof.idleRamp) {
        const f = (i - (count - prof.idleRamp)) / prof.idleRamp;
        idle = idleBase + (prof.idleEnd - idleBase) * f;
      }
      o.idle_ms.push(Math.round(idle));
      o.flow_in_kbps.push(+(flowIn + flowInAmp * Math.abs(Math.sin(i / 6 + prof.ph))).toFixed(1));
      o.flow_out_kbps.push(+(flowOut + flowOutAmp * Math.abs(Math.sin(i / 3 + prof.ph))).toFixed(1));
    }
    o.ping[Math.floor(count * 0.42)] = null;
    return o;
  };
  const client_series = {
    "0:u2": mkSeries({ ph: 0.0, ping: 42, pingAmp: 8, spike: 0, loss: 0.5, lossAmp: 1.2, choke: 0, chokeAmp: 0.4, fill: 2, gap: 1, idleBase: 15 }),
    "0:u3": mkSeries({ ph: 1.3, ping: 88, pingAmp: 28, spike: 30, loss: 2.5, lossAmp: 5, choke: 0.8, chokeAmp: 2.5, fill: 8, gap: 4, idleBase: 30, idleEnd: 60000, idleRamp: 18 }),
    "0:u4": mkSeries({ ph: 2.1, ping: 60, pingAmp: 12, spike: 5, loss: 1.0, lossAmp: 2, choke: 0.2, chokeAmp: 1, fill: 4, gap: 2, idleBase: 20 }),
    "0:u5": mkSeries({ ph: 0.7, ping: 35, pingAmp: 6, spike: 0, loss: 0.2, lossAmp: 0.6, choke: 0, chokeAmp: 0.3, fill: 2, gap: 1, idleBase: 12 }),
    "0:u6": mkSeries({ ph: 3.4, ping: 120, pingAmp: 40, spike: 60, loss: 5, lossAmp: 8, choke: 2, chokeAmp: 4, fill: 20, gap: 6, idleBase: 90, idleJitter: 40 }),
    "0:u7": mkSeries({ ph: 4.2, ping: 132, pingAmp: 40, spike: 80, loss: 4, lossAmp: 9, choke: 3, chokeAmp: 6, fill: 30, fillGrow: 62, gap: 9, idleBase: 60, idleEnd: 900, idleRamp: 10 }),
    "1:u101": mkSeries({ ph: 0.0, ping: 45, pingAmp: 10, spike: 12, loss: 0.6, lossAmp: 1.4, choke: 0, chokeAmp: 0.5, fill: 3, gap: 1, idleBase: 18 }, N1, t1),
    "1:u102": mkSeries({ ph: 1.9, ping: 52, pingAmp: 14, spike: 8, loss: 1.2, lossAmp: 2.2, choke: 0.3, chokeAmp: 1.1, fill: 5, gap: 2, idleBase: 22 }, N1, t1),
  };
  const mkIdent = (session, run, slot, id, name, authid, s64, ip, port, userid, conn, fake, proxy, first, last, samples) =>
    ({ session, run, id, slot, name, authid, steamid64: s64, ip, port, userid,
       conn_s: conn, fake, proxy, first_t: first, last_t: last, samples });
  const client_identities = {
    "0:u2":  mkIdent("0:u2", 0, 0, 0, "PlayerOne",   "STEAM_0:0:1001", "76561197960266730", "10.0.0.11", 27005, 2,   3600, false, false, t0, run0End, N),
    "0:u3":  mkIdent("0:u3", 0, 1, 1, "PlayerTwo",   "STEAM_0:1:1002", "76561197960266731", "10.0.0.12", 27006, 3,   1800, false, false, t0, run0End, N),
    "0:u4":  mkIdent("0:u4", 0, 2, 2, "Bot",         "BOT",           "",                  "127.0.0.1", 27015, 4,   600,  true,  false, t0, run0End, N),
    "0:u5":  mkIdent("0:u5", 0, 3, 3, "PlayerThree", "STEAM_0:0:1003", "76561197960266732", "10.0.0.13", 27007, 5,   2400, false, false, t0, run0End, N),
    "0:u6":  mkIdent("0:u6", 0, 4, 4, "PlayerFour",  "STEAM_0:1:1004", "76561197960266733", "10.0.0.14", 27008, 6,   900,  false, false, t0, run0End, N),
    "0:u7":  mkIdent("0:u7", 0, 5, 5, "Proxied",     "STEAM_0:1:1005", "76561197960266734", "10.0.0.15", 27009, 7,   1200, false, true,  t0, run0End, N),
    "1:u101": mkIdent("1:u101", 1, 0, 0, "PlayerOne", "STEAM_0:0:1001", "76561197960266730", "10.0.0.21", 27105, 101, 900,  false, false, t1, run1End, N1),
    "1:u102": mkIdent("1:u102", 1, 1, 1, "PlayerFive","STEAM_0:0:1006", "76561197960266735", "10.0.0.22", 27106, 102, 300,  false, false, t1, run1End, N1),
  };

  const clients = Object.keys(client_identities).map(s => {
    const idn = client_identities[s];
    const agg = aggregateSeries(client_series[s] || {});
    return Object.assign({ session: s }, identityColumns(idn),
      { run: idn.run, id: idn.id, first_t: idn.first_t, last_t: idn.last_t }, agg);
  });

  const dropDefs = [
    { s: "0:u3", t: t0 + 8, reason: "Timeout", category: "timeout", idle: 1200, crash: false, fully: true },
    { s: "0:u5", t: t0 + 17, reason: "Reliable channel overflowed", category: "overflow", idle: 400, crash: false, fully: true },
    { s: "0:u7", t: t0 + 22, reason: "Timeout", category: "timeout", idle: 60000, crash: false, fully: true },
    { s: "0:u4", t: t0 + 31, reason: "Client left", category: "user", idle: 30, crash: false, fully: true },
    { s: "0:u6", t: t0 + 47, reason: "Fragmented packet", category: "malformed", idle: 0, crash: false, fully: true },
    { s: "0:u7", t: t0 + 53, reason: "Reliable channel overflowed", category: "overflow", idle: 150, crash: true, fully: true },
    { s: "1:u101", t: t1 + 5, reason: "Timeout", category: "timeout", idle: 60000, crash: false, fully: true },
    { s: "1:u101", t: t1 + 18, reason: "Reliable channel overflowed", category: "overflow", idle: 200, crash: false, fully: true },
  ];
  const drops = dropDefs.map(d => {
    const idn = client_identities[d.s] || {};
    return {
      t: d.t, iso: new Date(d.t * 1000).toISOString(),
      id: idn.id != null ? idn.id : null,
      session: d.s,
      gen: idn.userid != null ? idn.userid : null,
      reason: d.reason, category: d.category, crash: d.crash,
      observed_via: "sv_dropclient",
      netchan: { now_real: d.t, idle_ms: d.idle, sv_timeout: 60 },
      client: { fully_connected: d.fully },
      name: idn.name || "", authid: idn.authid || "", steamid64: idn.steamid64 || "",
      ip: idn.ip || "", port: idn.port != null ? idn.port : null,
      slot: idn.slot != null ? idn.slot : null,
      userid: idn.userid != null ? idn.userid : null,
      conn_s: idn.conn_s != null ? idn.conn_s : null,
      fake: idn.fake === true, proxy: idn.proxy === true,
    };
  });

  const events = [
    { kind: "warmup", start: t0, end: t0 + 10, reason: "warmup" },
    { kind: "mapchange", start: t0 + 22, end: t0 + 42, reason: "de_dust2" },
    { kind: "shutdown", start: run0End - 3, end: run0End, reason: "graceful" },
  ];
  const anomalies_excluded = [
    "shutdown: lag spikes: 2 всплеска задержки > 100 мс",
    "mapchange: hitch cluster: 3 hitches (окно 10.0s)",
  ];

  /* focus events: one idle_hang for PlayerOne (session 0:u2), ~6 s long, in range.
     client_series["0:u2"] already carries idle_ms, so focusing works offline. */
  const focus_points = [
    { kind: "idle_hang", session: "0:u2", player: "76561197960266730",
      start_t: t0 + 40, end_t: t0 + 46, duration_s: 6, peak_idle_ms: 6200,
      drop_after: true, slot: 0, userid: 2, name: "PlayerOne", steamid64: "76561197960266730" },
  ];

  /* demo host series: nulls (gaps), caveat bits (rings) and normal points */
  const hostSeries = {
    t: t.slice(), udp_rcvbuf_errors: [], udp_in_errors: [],
    udp_in_csum_errors: [], net_rx_dropped: [], net_rx_missed: [],
    net_rx_overruns: [], steal_pct: [], io_read_bytes: [], io_write_bytes: [],
    disk_bavail_mb: [], present_mask: [], caveat_mask: [],
  };
  for (let i = 0; i < N; i++) {
    const udpV = (i % 29 === 0) ? 12 : 0;
    const dropV = (i % 13 === 0) ? 2 : ((i % 7 === 0) ? 1 : 0);
    const missV = (i % 19 === 0) ? 3 : 0;
    hostSeries.udp_rcvbuf_errors.push(i % 11 === 0 ? null : udpV);
    hostSeries.udp_in_errors.push(i % 17 === 0 ? null : Math.max(0, udpV - 9));
    hostSeries.udp_in_csum_errors.push(null);
    hostSeries.net_rx_dropped.push(dropV);
    hostSeries.net_rx_missed.push(missV);
    hostSeries.net_rx_overruns.push(null);
    hostSeries.steal_pct.push(+(0.4 + 0.3 * Math.abs(Math.sin(i / 9))).toFixed(2));
    hostSeries.io_read_bytes.push(4096 + Math.round(2048 * Math.abs(Math.sin(i / 5))));
    hostSeries.io_write_bytes.push(8192 + Math.round(4096 * Math.abs(Math.sin(i / 7))));
    hostSeries.disk_bavail_mb.push(i % 23 === 0 ? null : (45678 - i * 2));
    const caveat = 1 | 2 | (i % 6 === 0 ? 4 : 0) | 8 | 16;
    hostSeries.caveat_mask.push(caveat);
    hostSeries.present_mask.push(i % 11 === 0 ? caveat & ~1 : 1023);
  }
  const host_caveats = {
    udp_rcvbuf_errors: { source: "udp_netns", bit: 1 },
    udp_in_errors: { source: "udp_netns", bit: 1 },
    udp_in_csum_errors: { source: "udp_netns", bit: 1 },
    net_rx_dropped: { source: "net_dev", bit: 2 },
    net_rx_missed: { source: "net_dev", bit: 2 },
    net_rx_overruns: { source: "net_dev", bit: 2 },
    steal_pct: { source: "steal", bit: 4 },
    io_read_bytes: { source: "io", bit: 8 },
    io_write_bytes: { source: "io", bit: 8 },
    disk_bavail_mb: { source: "disk", bit: 16 },
  };
  const configSnap = (t0v, map, ticrate, diff) => ({
    t: t0v, rehlds_major: 3, rehlds_minor: 14, map: map, maxclients: 32,
    sys_ticrate: ticrate, host_framerate: 0, sv_timeout: 65,
    sv_maxrate: 0, sv_minrate: 0, sv_maxupdaterate: 101, sv_minupdaterate: 10,
    sv_maxcmdrate: 101, sv_mincmdrate: 10, diff: diff,
  });
  const config = [
    configSnap(t0, "de_dust2", 100,
      { baseline: false, changed: [], added: [], removed: [] }),
    configSnap(t0 + 40, "de_nuke", 120, {
      baseline: true,
      changed: [
        { field: "sys_ticrate", before: 100, after: 120 },
        { field: "map", before: "de_dust2", after: "de_nuke" },
      ],
      added: [], removed: [],
    }),
  ];

  const sessionCount = Object.keys(client_identities).length;
  const counts = { server: N, client: 219, drop: drops.length, reject: 4, connect: 9, netcmd: 63, massdrop: 2, packet: N, hitch: 6, mapchange: 1, voice: 14 };
  const records_count = Object.keys(counts).reduce((a, k) => a + counts[k], 0);

  const digest = {
    files: ["demo_a.jsonl", "demo_b.jsonl"],
    records: records_count,
    counts_by_type: counts,
    period: { start: t[0], end: run1End, duration_s: run1End - t[0] },
    players: [2, 3, 4, 5, 6, 7, 101, 102],
    sessions: sessionCount,
    drop_count: drops.length,
    top_drop_reasons: [["Timeout", 3], ["Reliable channel overflowed", 3], ["Client left", 1], ["Fragmented packet", 1]],
    hitch_lines: counts.hitch,
    lag_spikes: 5,
    log_end: "graceful",
    anomalies_excluded: anomalies_excluded.length,
  };

  return {
    ok: true, version: 1,
    files: digest.files,
    digest: digest,
    series: {
      t: t,
      frame_ms_min: frameMin, frame_ms_avg: frameAvg, frame_ms_max: frameMax,
      cpu_pct: cpu, rss_kb: rss,
      players: players, real_players: real, edicts: edicts, fps: fps,
      in_kbps: inK, out_kbps: outK,
    },
    clients: clients,
    client_series: client_series,
    client_identities: client_identities,
    sessions: buildPlayerGroups(client_identities),
    session_count: sessionCount,
    drops: drops,
    events: events,
    log_end: "graceful",
    anomalies: [
      "hitch cluster: 6 hitches между " + fmtIso(t0 + 20) + " и " + fmtIso(t0 + 30) + " (окно 10.0s)",
      "reliable channel fill: игрок 11 — rel_fill достиг 96% перед отключением",
      "lag spikes: 5 всплесков задержки > 100 мс",
    ],
    anomalies_excluded: anomalies_excluded,
    focus_points: focus_points,
    host_series: hostSeries,
    host_caveats: host_caveats,
    config: config,
    records_count: records_count,
  };
}

/* =====================================================================

function init() {
  // Restore persisted panel collapse choices, merged OVER the defaults.
  state.collapsed = Object.assign({}, DEFAULT_COLLAPSED, collapsedLoad() || {});
  // Restore persisted combined-panel dataset settings (selection / normalize / events / per-player metrics).
  datasetsLoad();
  // Restore the sticky «Период» choice (REQ-L8) before the first render.
  stickyLoad();

  renderFileList();

  const dropzone = $("#dropzone");
  const input = $("#fileInput");

  input.addEventListener("change", () => { addFiles(input.files); input.value = ""; });

  dropzone.addEventListener("keydown", (e) => {
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); input.click(); }
  });

  ["dragenter", "dragover"].forEach(evt => {
    dropzone.addEventListener(evt, (e) => { e.preventDefault(); dropzone.classList.add("drag"); });
  });
  ["dragleave", "dragend"].forEach(evt => {
    dropzone.addEventListener(evt, () => dropzone.classList.remove("drag"));
  });
  dropzone.addEventListener("drop", (e) => {
    e.preventDefault();
    dropzone.classList.remove("drag");
    if (e.dataTransfer && e.dataTransfer.files) addFiles(e.dataTransfer.files);
  });
  // better UX: allow dropping anywhere on the page
  window.addEventListener("dragover", (e) => { e.preventDefault(); });
  window.addEventListener("drop", (e) => {
    e.preventDefault();
    dropzone.classList.remove("drag");
    if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length) addFiles(e.dataTransfer.files);
  });

  $("#btnAnalyze").addEventListener("click", () => fetchAnalyze({ reset: true }));
  $("#btnDemo").addEventListener("click", () => {
    revokeUrls();
    state.source = "demo";
    state.handle = null;
    state.fileBlob = null;
    state.coarse = false;
    state.window = null;
    state.fullRange = null;
    state.demo = true;
    state.period = { from: null, to: null };
    state.selectedClient = null;
    render(makeDemo());
    setStatus("Показаны демо-данные (без обращения к серверу).", "info");
  });
  $("#btnClear").addEventListener("click", () => {
    revokeUrls();
    state.result = null; state.source = null; state.handle = null; state.fileBlob = null;
    state.coarse = false; state.window = null; state.fullRange = null;
    state.demo = false;
    state.view = null; state.period = { from: null, to: null };
    state.selectedClient = null;
    refreshAllPanelUI = null;
    $("#results").hidden = true; $("#results").textContent = "";
    $("#btnClear").hidden = true;
    setExportEnabled(false);
    setModeBadge(false);
    setLogEndBadge(null);
    setStatus("", "info");
  });

  $$("[data-type]").forEach(btn => {
    btn.addEventListener("click", () => downloadCsv(btn.getAttribute("data-type")));
  });
  $("#btnSelfTest").addEventListener("click", selfTest);

  const setAllPanelsCollapsed = (collapsed) => {
    if (!state.result) return;
    $$("#results .panel").forEach(p => {
      const h2 = $("h2", p);
      if (h2) state.collapsed["p:" + h2.textContent] = collapsed;
    });
    collapsedSave();
    render(state.result);
  };
  $("#btnCollapseAll").addEventListener("click", () => setAllPanelsCollapsed(true));
  $("#btnExpandAll").addEventListener("click", () => setAllPanelsCollapsed(false));

  $("#ftpToggle").addEventListener("click", () => {
    const body = $("#ftpBody");
    const show = body.hidden;
    body.hidden = !show;
    $("#ftpToggle").textContent = show ? "Скрыть" : "Показать";
    $("#ftpToggle").setAttribute("aria-expanded", show ? "true" : "false");
  });
  $("#ftpConnect").addEventListener("click", ftpConnect);
  $("#ftpRefresh").addEventListener("click", () => ftpRefresh(true));
  $("#ftpLoadEarlier").addEventListener("click", ftpLoadEarlier);
  $("#ftpClose").addEventListener("click", ftpDisconnect);
  $("#ftpAuto").addEventListener("change", () => {
    if ($("#ftpAuto").checked) { ftpIntervalChanged(); ftpStartAuto(); }
    else ftpStopAuto();
  });
  $("#ftpInterval").addEventListener("change", ftpIntervalChanged);
  ["ftpHost", "ftpPort", "ftpUser", "ftpPassword", "ftpPath", "ftpInterval"].forEach((id) => {
    const el = $("#" + id);
    if (el) {
      el.addEventListener("input", ftpPrefsChanged);
      el.addEventListener("change", ftpPrefsChanged);
    }
  });
  if ($("#ftpTls")) $("#ftpTls").addEventListener("change", ftpPrefsChanged);
  if ($("#ftpRemember")) $("#ftpRemember").addEventListener("change", ftpSavePrefs);
  ftpLoadPrefs();
  ftpIntervalChanged();
  setFtpControls();

  checkHealth();
  syncTopbarHeight();
  window.addEventListener("resize", syncTopbarHeight);
}

async function checkHealth() {
  const dot = $("#healthDot"), txt = $("#healthText"), badge = $("#healthBadge");
  try {
    const res = await fetch("/api/health", { method: "GET" });
    const data = await res.json();
    if (res.ok && data && data.ok) {
      dot.className = "dot ok";
      txt.textContent = "сервер v" + data.version;
      badge.title = "Сервис: " + (data.service || "?");
    } else {
      throw new Error("bad health");
    }
  } catch (e) {
    dot.className = "dot";
    txt.textContent = "сервер недоступен";
  }
}

      try {
        const node = buildAllChart(view);
        if (node.querySelector && !node.querySelector(".caveat-marker")) throw new Error("нет caveat-маркеров");
        return node;
      } finally { state.allSeries = saved; }
    }],
    ["config-panel", () => buildConfigPanel(view, demo)],
    ["focus-panel", () => buildFocusPanel(view, demo)],
    ["clients", () => buildClientsTable(view.clients)],
    ["ftp-panel", () => { const p = $("#ftpPanel"); if (!p) throw new Error("нет #ftpPanel"); return p; }],
    ["local-progress", () => {
      const box = $("#localProgress");
      if (!box) throw new Error("нет #localProgress");
      const track = $("#localProgressTrack");
      if (!track || track.getAttribute("role") !== "progressbar") throw new Error("нет роли progressbar у локального прогресс-бара");
      if (track.getAttribute("aria-valuemin") !== "0" || track.getAttribute("aria-valuemax") !== "100") throw new Error("нет aria-valuemin/max у локального прогресс-бара");
      if (typeof localProgressSet !== "function" || typeof localProgressPollStart !== "function" || typeof analyzeViaXhr !== "function") {
        throw new Error("нет пломбинга прогресса локального анализа");
      }
      if (String(localProgressPollStart).indexOf("/api/analyze/progress") === -1) throw new Error("нет поллинга /api/analyze/progress");
      if (String(analyzeViaXhr).indexOf("upload.onprogress") === -1) throw new Error("нет upload.onprogress в транспорте загрузки");
      return box;
    }],
    /* ---- Stage 12 UI QAS (L16/L17/L18) — browser-only, outside `make test` ---- */
    ["L16-ftp-window-controls", () => {
      const size = $("#ftpWindowSize");
      if (!size) throw new Error("нет #ftpWindowSize");
      const vals = Array.from(size.options).map(o => o.value);
      for (const v of ["300", "900", "1800", "3600", "21600", "86400"]) {
        if (vals.indexOf(v) === -1) throw new Error("нет пресета окна " + v + " с");
      }
      const track = document.querySelector("#ftpProgressTrack");
      if (!track || track.getAttribute("role") !== "progressbar") throw new Error("нет роли progressbar у прогресс-бара");
      for (const id of ["ftpRange", "ftpReached", "ftpCap", "ftpLoadEarlier", "ftpRefresh"]) {
        if (!document.getElementById(id)) throw new Error("нет #" + id);
      }
      return size;
    }],
    ["L17-period-compact", () => {
      const node = buildPeriodPanel(demo);
      const holder = el("div");
      holder.style.position = "absolute";
      holder.style.left = "-10000px";
      holder.style.top = "0";
      holder.style.width = "1220px";
      holder.style.visibility = "hidden";
      holder.appendChild(node);
      document.body.appendChild(holder);
      const h = node.offsetHeight;
      holder.remove();
      if (!(h > 0 && h <= PERIOD_MAX_HEIGHT_PX)) {
        throw new Error("высота блока «Период» " + h + "px > " + PERIOD_MAX_HEIGHT_PX + "px");
      }
      return node;
    }],
    ["L18-sticky-persist", () => {
      const store = ftpPrefsStore();
      if (!store) throw new Error("localStorage недоступен");
      if (typeof STICKY_KEY !== "string" || STICKY_KEY.indexOf("hldsmon.ui.") !== 0) {
        throw new Error("неверный ключ sticky: " + STICKY_KEY);
      }
      const raw = store.getItem(STICKY_KEY);
      const prev = state.sticky;
      try {
        store.setItem(STICKY_KEY, "0"); state.sticky = true; stickyLoad();
        if (state.sticky !== false) throw new Error("sticky=false не восстановлен из localStorage");
        store.setItem(STICKY_KEY, "1"); state.sticky = false; stickyLoad();
        if (state.sticky !== true) throw new Error("sticky=true не восстановлен из localStorage");
      } finally {
        if (raw == null) store.removeItem(STICKY_KEY); else store.setItem(STICKY_KEY, raw);
      }
      // the built panel reflects the off state and carries the toggle
      state.sticky = false;
      const node = buildPeriodPanel(demo);
      const cb = node.querySelector("#periodSticky");
      const ok = node.classList.contains("no-sticky") && !!cb && cb.checked === false;
      state.sticky = prev;
      if (raw == null) store.removeItem(STICKY_KEY); else store.setItem(STICKY_KEY, raw);
      if (!ok) throw new Error("блок «Период» не отражает sticky-выключение");
      return node;
    }],
  ];
  const resultsList = [];
  let failed = 0;
  for (const [name, fn] of checks) {
    try {
      const node = fn();
      const ok = !!node;
      if (!ok) { failed++; resultsList.push("✗ " + name + ": пустой результат"); }
      else resultsList.push("✓ " + name);
    } catch (err) {
      failed++;
      resultsList.push("✗ " + name + ": " + (err && err.message ? err.message : String(err)));
    }
  }
  const summary = "Самопроверка: " + (checks.length - failed) + "/" + checks.length + " ok";
  if (window.console && console.log) console.log("[self-test]", summary, resultsList);
  toast(summary + (failed ? (" · " + failed + " ошибок") : ""), failed ? "error" : "ok");
  return { total: checks.length, failed: failed, results: resultsList };
}

document.addEventListener("DOMContentLoaded", init);
// expose for manual console verification
window.__hldsmon = { makeDemo, render, buildCharts, buildClientCharts, computeView, selectClient, selfTest, state, ftp, buildDropsChart, buildAllChart, buildAllPanel, buildConfigPanel, buildPlayerGroups, buildFocusPanel, focusOnPoint, selectedPlayer, syncClientPickers, downloadBundle, alignHostToServerTime, fetchAnalyze, buildUploadBlob, buildPeriodPanel, fmtRange, applySticky, ftpUpdateRange, STICKY_KEY, PERIOD_MAX_HEIGHT_PX };
</script>
</body>

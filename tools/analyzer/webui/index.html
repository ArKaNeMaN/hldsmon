   ===================================================================== */
const ACCEPT_RE = /\.(jsonl|json|txt|log)$/i;

function addFiles(fileList) {
  const incoming = Array.from(fileList || []);
  const accepted = [];
  for (const f of incoming) {
    if (!ACCEPT_RE.test(f.name)) { toast("Пропущен файл «" + f.name + "»: недопустимый формат", "error"); continue; }
    if (!state.files.some(existing => existing.name === f.name && existing.size === f.size)) accepted.push(f);
  }
  if (accepted.length) {
    state.files = state.files.concat(accepted);
    state.fileBlob = null;   // file set changed -> rebuild the composite upload Blob
    renderFileList();
    setStatus("Выбрано файлов: " + state.files.length + ". Нажмите «Анализ».", "info");
  }
}
function removeFile(idx) {
  state.files.splice(idx, 1);
  state.fileBlob = null;
  renderFileList();
  setStatus(state.files.length ? "Выбрано файлов: " + state.files.length + "." : "Файлы не выбраны.", "info");
}
function renderFileList() {
  const box = $("#fileItems");
  box.textContent = "";
  if (!state.files.length) {
    box.appendChild(el("div", "empty", "файлы не выбраны"));
  } else {
    state.files.forEach((f, i) => {
      const row = el("div", "file-item");
      row.appendChild(el("span", "fi-name", f.name));
      row.appendChild(el("span", "fi-size", humanBytes(f.size)));
      const x = el("button", "fi-x", "\u00D7");
      x.type = "button";
      x.title = "Убрать файл";
      x.setAttribute("aria-label", "Убрать файл " + f.name);
      x.addEventListener("click", (e) => { e.preventDefault(); e.stopPropagation(); removeFile(i); });
      row.appendChild(x);
      box.appendChild(row);
    });
  }
  $("#fileSummary").textContent = state.files.length + " файл(ов)";
  $("#btnAnalyze").disabled = state.files.length === 0;
}

/* =====================================================================
   API calls
   ===================================================================== */
/* Build the composite upload body straight from the selected File objects.
   No whole-file JS string is ever built: the browser streams the Blob to the
   server, which spools it to disk. Order is preserved and matches the `files=`
   query order exactly. BOM and CRLF are handled on the ingest/server side
   (hldsmon.iter_records strips), so no client-side normalisation is needed. */
function buildUploadBlob(files) {
  return new Blob(files, { type: "text/plain;charset=utf-8" });
}

/* Map an error response (JSON `{code,limit_bytes}` or bare HTTP status) to an
   actionable Russian message. `log_too_large` only ever arrives when the reader
   valve is on — by default the server has no size cap. */
function httpErrorText(status, data) {
  const code = data && data.code;
  const limit = data && isNum(data.limit_bytes) ? data.limit_bytes : null;
  if (code === "log_too_large") return "Файл превышает лимит клапана чтения" + (limit != null ? " (" + humanBytes(limit) + ")" : "") + ".";
  if (code === "session_expired") return "Сессия истекла — загрузите файл заново.";
  if (code === "unlimited_nonloopback_disabled") return "Безлимитный приём запрещён на не-loopback — запустите сервер с --allow-nonloopback-unlimited.";
  if (code === "request_timeout") return "Таймаут чтения запроса (408).";
  if (code === "busy") return "Сервер занят (лимит одновременных загрузок) — повторите позже (429).";
  if (code === "spool_full") return "На сервере закончилось место под spool (507).";
  if (code === "length_required") return "Серверу нужен заголовок Content-Length (411).";
  if (status === 413) return "Файл слишком большой (413)" + (limit != null ? ": лимит " + humanBytes(limit) : "") + ".";
  if (status === 411) return "Серверу нужен Content-Length (411).";
  if (status === 403) return "Доступ запрещён (403).";
  if (status === 408) return "Таймаут запроса (408).";
  if (status === 429) return "Слишком много запросов (429).";
  if (status === 507) return "Недостаточно места на сервере (507).";
  if (status === 410) return "Сессия истекла (410).";
  if (data && data.error) return data.error;
  return "HTTP " + status;
}
/* Local-file analysis progress: a two-phase determinate bar.
   Phase 1 = upload bytes (XMLHttpRequest.upload.onprogress);
   Phase 2 = server-side parse bytes, polled via /api/analyze/progress. */
const localProgress = { timer: null };

function localProgressLabel(text) {
  const l = $("#localProgressLabel");
  if (l) l.textContent = text || "";
}

function localProgressPhaseLabel(prefix, pct) {
  const n = (pct != null && isFinite(pct)) ? Math.round(pct) : 0;
  return prefix + " " + n + "%";
}

function localProgressSet(pct, done, total, label) {
  const box = $("#localProgress");
  const fill = $("#localProgressFill");
  const track = $("#localProgressTrack");
  if (!box || !fill) return;
  box.hidden = false;
  box.classList.remove("indeterminate", "analyzing");
  const has = (pct != null && isFinite(pct));
  const clamped = has ? Math.max(0, Math.min(100, pct)) : 0;
  fill.style.width = clamped + "%";
  if (track) {
    track.setAttribute("aria-valuenow", String(Math.round(clamped)));
    track.setAttribute("aria-valuetext", has ? (Math.round(clamped) + "%") : "ожидание");
  }
  if (label != null) localProgressLabel(label);
}

function localProgressStart() {
  const box = $("#localProgress");
  if (box) { box.hidden = false; box.classList.remove("indeterminate", "analyzing"); }
  localProgressSet(0, null, null, "Загрузка на сервер… 0%");
}

function localProgressStopPoll() {
  if (localProgress.timer) { clearInterval(localProgress.timer); localProgress.timer = null; }
}

function localProgressHide() {
  localProgressStopPoll();
  const box = $("#localProgress");
  if (box) box.hidden = true;
}

function localProgressPollStart(job) {
  localProgressStopPoll();
  localProgress.timer = setInterval(async () => {
    try {
      const res = await fetch("/api/analyze/progress?id=" + encodeURIComponent(job));
      const data = await res.json();
      const p = data && data.progress;
      if (!p || p.finished) return;
      const parse = p.phase === "parse";
      const label = localProgressPhaseLabel(parse ? "Разбор данных…" : "Загрузка на сервер…", p.pct);
      localProgressSet(p.pct, p.done, p.total, label);
    } catch (e) { /* progress is best-effort */ }
  }, 400);
}

function analyzeViaXhr(url, blob, job) {
  return new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest();
    xhr.open("POST", url);
    xhr.setRequestHeader("Content-Type", "text/plain;charset=utf-8");
    xhr.upload.onprogress = (ev) => {
      if (ev.lengthComputable && ev.total > 0) {
        const pct = 100.0 * ev.loaded / ev.total;
        localProgressSet(pct, ev.loaded, ev.total, localProgressPhaseLabel("Загрузка на сервер…", pct));
      } else {
        localProgressSet(null, ev.loaded, null, "Загрузка на сервер…");
      }
    };
    xhr.upload.onload = () => {
      localProgressSet(0, 0, null, "Разбор данных… 0%");
      localProgressPollStart(job);
    };
    xhr.onload = () => {
      localProgressStopPoll();
      let data = null;
      try { data = JSON.parse(xhr.responseText); } catch (e) { data = null; }
      if (xhr.status >= 200 && xhr.status < 300 && data && data.ok === true) resolve(data);
      else reject(new Error(httpErrorText(xhr.status, data)));
    };
    xhr.onerror = () => { localProgressStopPoll(); reject(new Error("сетевая ошибка")); };
    xhr.onabort = () => { localProgressStopPoll(); reject(new Error("запрос прерван")); };
    xhr.ontimeout = () => { localProgressStopPoll(); reject(new Error("таймаут запроса")); };
    xhr.send(blob);
  });
}

/* fetchAnalyze: direct Blob upload + SERVER-SIDE period (stage 12).
   - no from/to -> coarse whole-day overview + handle (downsampled series)
   - from/to   -> materialized full-resolution window (coarse=false)
   The period is chosen BEFORE the request; local results are never filtered
   from a full-resolution payload client-side. `reset` starts a fresh upload.
   Uses XMLHttpRequest (not fetch) so the upload-progress phase is observable;
   a per-request `job` id drives the server-side parse-progress poll. */
async function fetchAnalyze(opts) {
  opts = opts || {};
  if (!state.files.length) { setStatus("Сначала выберите файлы.", "error"); return; }
  if (state.analyzing) return;
  if (opts.reset) { state.period = { from: null, to: null }; }
  const from = (opts.from !== undefined) ? opts.from : state.period.from;
  const to = (opts.to !== undefined) ? opts.to : state.period.to;
  state.analyzing = true;
  setLoading(true);
  setStatus((isNum(from) || isNum(to)) ? "Запрос окна…" : "Загрузка и анализ (обзор дня)…", "info");
  localProgressStart();
  try {
    const blob = state.fileBlob || buildUploadBlob(state.files);
    state.fileBlob = blob;
    const names = state.files.map(f => f.name);
    const q = new URLSearchParams();
    q.set("files", names.join(","));
    if (isNum(from)) q.set("from", String(from));
    if (isNum(to)) q.set("to", String(to));
    const job = ftpNewJob();
    q.set("job", job);
    const data = await analyzeViaXhr("/api/analyze?" + q.toString(), blob, job);
    revokeUrls();
    state.source = "local";
    state.demo = false;
    state.handle = data.handle || null;
    state.coarse = data.coarse === true;
    state.window = data.window || null;
    state.period = { from: isNum(from) ? from : null, to: isNum(to) ? to : null };
    const p = data.digest && data.digest.period;
    if (p && isNum(p.start)) state.fullRange = { start: p.start, end: isNum(p.end) ? p.end : null };
    if (opts.reset) state.selectedClient = null;
    render(data);
    const mode = state.coarse
      ? "обзор дня"
      : ("окно " + fmtInt(data.window_count) + " записей");
    setStatus("Готово: " + fmtInt(data.records_count) + " записей из " + names.length + " файл(ов) · " + mode + ".", "ok");
  } catch (err) {
    const msg = (err && err.message ? err.message : String(err));
    setStatus("Ошибка анализа: " + msg, "error");
    toast("Ошибка анализа: " + msg, "error");
  } finally {
    localProgressHide();
    state.analyzing = false;
    setLoading(false);
  }
}

async function downloadCsv(type) {
  if (state.demo || !state.handle) {
    toast("Экспорт CSV доступен только при работе с сервером.", "error");
    return;
  }
  const label = type ? type : "все";
  try {
    const q = new URLSearchParams();
    q.set("handle", state.handle);
    if (type) q.set("type", type);
    if (isNum(state.period.from)) q.set("from", String(state.period.from));
    if (isNum(state.period.to)) q.set("to", String(state.period.to));
    const res = await fetch("/api/export?" + q.toString(), { method: "POST" });
    if (!res.ok) {
      let data = null; try { data = await res.json(); } catch (e) { data = null; }
      if (data && data.code === "session_expired") { state.handle = null; setExportEnabled(false); }
      throw new Error(httpErrorText(res.status, data));
    }
    const blob = await res.blob();
    const objUrl = URL.createObjectURL(blob);
    state.urls.push(objUrl);
    const a = el("a");
    a.href = objUrl;
    a.download = "hldsmon_" + (type || "all") + ".csv";
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(objUrl), 5000);
    toast("Экспорт CSV (" + label + ") запущен", "ok");
  } catch (err) {
    toast("Ошибка экспорта: " + (err && err.message ? err.message : String(err)), "error");
  }
}

/* Download the incident JSON envelope for one drop (server-side /api/bundle).
   Addressed by the stable drop key {run,t,userid} + the spool handle (no body). */
async function downloadBundle(drop, mins) {
  if (state.demo || !state.handle) {
    toast("Bundle доступен только при работе с сервером.", "error");
    return;
  }
  if (!drop) { toast("Drop не найден.", "error"); return; }
  const key = drop.key || {};
  const run = isNum(key.run) ? key.run : (isNum(drop.run) ? drop.run : null);
  const t = isNum(key.t) ? key.t : (isNum(drop.t) ? drop.t : null);
  const userid = isNum(key.userid) ? key.userid : (isNum(drop.userid) ? drop.userid : null);
  if (run == null || t == null) {
    toast("У drop нет стабильного ключа (run,t) для адресации — bundle недоступен.", "error");
    return;
  }
  const m = (typeof mins === "number" && isFinite(mins) && mins >= 0) ? mins : 2;
  try {
    const q = new URLSearchParams();
    q.set("handle", state.handle);
    q.set("run", String(run));
    q.set("t", String(t));
    if (userid != null) q.set("userid", String(userid));
    q.set("mins", String(m));
    const res = await fetch("/api/bundle?" + q.toString(), { method: "POST" });
    if (!res.ok) {
      let data = null; try { data = await res.json(); } catch (e) { data = null; }
      if (data && data.code === "session_expired") { state.handle = null; setExportEnabled(false); }
      throw new Error(httpErrorText(res.status, data));
    }
    const blob = await res.blob();
    const objUrl = URL.createObjectURL(blob);
    state.urls.push(objUrl);
    const stamp = new Date(t * 1000).toISOString().replace(/[:.]/g, "-");
    const a = el("a");
    a.href = objUrl;
    a.download = "hldsmon_bundle_" + stamp + ".json";
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(objUrl), 5000);
    toast("Bundle (run=" + run + ", t=" + fmtClock(t) + ") скачан", "ok");
  } catch (err) {
    toast("Ошибка bundle: " + (err && err.message ? err.message : String(err)), "error");
  }
}

function revokeUrls() {
  state.urls.forEach(u => { try { URL.revokeObjectURL(u); } catch (e) { /* ignore */ } });
  state.urls = [];
}

/* =====================================================================
   FTP live-tail — credentials are only ever sent in the POST JSON body.
   ===================================================================== */
const ftp = {
  session: null,       // opaque server-side session id
  path: "",            // resolved remote path (display only)
  auto: false,
  timer: null,
  intervalMs: 5000,
  lastError: null,
  busy: false,
  progressTimer: null,
  reachedStart: false, // true once the oldest byte of the remote file is loaded
};

function setFtpStatus(msg, kind) {
  const s = $("#ftpStatus");
  if (!s) return;
  s.className = "status " + (kind || "info");
  s.textContent = msg || "";
}

function ftpNewJob() {
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return "job-" + Date.now() + "-" + Math.floor(Math.random() * 1e9);
}

function ftpProgressLabel(text) {
  const l = $("#ftpProgressLabel");
  if (l) l.textContent = text || "";
}

function ftpSetProgress(pct, done, total) {
  const box = $("#ftpProgress");
  const fill = $("#ftpProgressFill");
  const track = $("#ftpProgressTrack");
  if (!box || !fill) return;
  if (pct == null || !isFinite(pct)) {
    box.classList.add("indeterminate");
    if (track) { track.removeAttribute("aria-valuenow"); track.setAttribute("aria-valuetext", "идёт загрузка"); }
    return;
  }
  box.classList.remove("indeterminate", "analyzing");
  const clamped = Math.max(0, Math.min(100, pct));
  fill.style.width = clamped + "%";
  if (track) {
    track.setAttribute("aria-valuenow", String(Math.round(clamped)));
    track.setAttribute("aria-valuetext", Math.round(clamped) + "%");
  }
  if (done != null && total != null && total > 0) {
    ftpProgressLabel("Загрузка: " + pct.toFixed(0) + "% · " + humanBytes(done) + " / " + humanBytes(total));
  } else if (done != null) {
    ftpProgressLabel("Загрузка: " + humanBytes(done));
  }
}

function ftpProgressAnalyzing() {
  const box = $("#ftpProgress");
  if (box) { box.hidden = false; box.classList.add("indeterminate", "analyzing"); }
  const track = $("#ftpProgressTrack");
  if (track) { track.removeAttribute("aria-valuenow"); track.setAttribute("aria-valuetext", "разбор данных"); }
  ftpProgressLabel("Разбор данных…");
}

function ftpProgressStop() {
  if (ftp.progressTimer) { clearInterval(ftp.progressTimer); ftp.progressTimer = null; }
  const box = $("#ftpProgress");
  if (box) box.hidden = true;
}

function ftpProgressStart(job, label) {
  ftpProgressStop();
  const box = $("#ftpProgress");
  if (box) { box.hidden = false; box.classList.remove("analyzing"); }
  ftpSetProgress(null);
  ftpProgressLabel(label || "Загрузка…");
  ftp.progressTimer = setInterval(async () => {
    try {
      const res = await fetch("/api/ftp/progress?id=" + encodeURIComponent(job));
      const data = await res.json();
      const p = data && data.progress;
      if (p && !p.finished) {
        if (p.phase === "parse") ftpProgressAnalyzing();
        else ftpSetProgress(p.pct, p.done, p.total);
      }
    } catch (e) { /* progress is best-effort */ }
  }, 300);
}

function ftpFormSpec() {
  return {
    host: $("#ftpHost").value.trim(),
    port: parseInt($("#ftpPort").value, 10) || 21,
    user: $("#ftpUser").value,
    password: $("#ftpPassword").value,
    path: $("#ftpPath").value.trim(),
    tls: $("#ftpTls").checked,
    window_s: selectedFtpWindow(),
  };
}

function ftpLogEndSuffix() {
  const t = logEndText(state.result && state.result.log_end);
  return t ? (" · завершение: " + t.label) : "";
}

// Loaded-window suffix for the FTP status line: earliest..latest + start-of-file hint.
function ftpWindowSuffix(f) {
  if (!f) return "";
  let s = "";
  if (isNum(f.start_t) && isNum(f.end_t)) {
    s += " · окно " + fmtIso(f.start_t) + " .. " + fmtIso(f.end_t);
  }
  if (f.reached_start) s += " (достигнуто начало файла)";
  return s;
}

/* FTP loaded-range indicator (REQ-L6): time range + remote byte range,
   `reached_start`, and `cap_hit` (only ever set when the reader valve is on). */
function ftpUpdateRange(f) {
  f = f || {};
  const range = $("#ftpRange");
  if (range) {
    if (isNum(f.start_t) && isNum(f.end_t)) {
      let txt = fmtIso(f.start_t) + " → " + fmtIso(f.end_t);
      if (isNum(f.start) && isNum(f.end)) txt += " · байты [" + fmtInt(f.start) + ", " + fmtInt(f.end) + "]";
      else if (isNum(f.bytes)) txt += " · " + humanBytes(f.bytes);
      range.hidden = false;
      range.textContent = txt;
      range.title = "Загруженный диапазон удалённого файла";
    } else {
      range.hidden = true;
    }
  }
  const reached = $("#ftpReached");
  if (reached) {
    if (f.reached_start) { reached.hidden = false; reached.textContent = "✓ достигнуто начало файла"; }
    else reached.hidden = true;
  }
  const cap = $("#ftpCap");
  if (cap) {
    if (f.cap_hit) {
      cap.hidden = false;
      cap.textContent = "⚠ упор в клапан" + (isNum(f.limit_bytes) ? " (" + humanBytes(f.limit_bytes) + ")" : "");
      cap.title = "Клапан чтения включён — загружена только часть файла (без тихой обрезки)";
    } else {
      cap.hidden = true;
    }
  }
}

function ftpHideRange() {
  ["#ftpRange", "#ftpReached", "#ftpCap"].forEach(sel => { const n = $(sel); if (n) n.hidden = true; });
}

/* The explicit FTP window size (REQ-L6 presets; default 30 min). */
function selectedFtpWindow() {
  const s = $("#ftpWindowSize");
  const v = s ? parseInt(s.value, 10) : NaN;
  return (isNum(v) && v > 0) ? v : 1800;
}

const FTP_PREFS_KEY = "hldsmon.ftp.v1";

function ftpPrefsStore() {
  try { return window.localStorage; } catch (e) { return null; }
}

function ftpLoadPrefs() {
  const store = ftpPrefsStore();
  if (!store) return;
  let prefs = null;
  try { prefs = JSON.parse(store.getItem(FTP_PREFS_KEY) || "null"); } catch (e) { prefs = null; }
  if (!prefs || typeof prefs !== "object") return;
  const set = (id, v) => { const el = $("#" + id); if (el && v != null) el.value = v; };
  set("ftpHost", prefs.host);
  set("ftpPort", prefs.port);
  set("ftpUser", prefs.user);
  set("ftpPassword", prefs.password);
  set("ftpPath", prefs.path);
  set("ftpInterval", prefs.interval);
  if ($("#ftpTls")) $("#ftpTls").checked = !!prefs.tls;
  if ($("#ftpRemember")) $("#ftpRemember").checked = prefs.remember !== false;
}

function ftpSavePrefs() {
  const store = ftpPrefsStore();
  if (!store) return;
  const remember = $("#ftpRemember") ? $("#ftpRemember").checked : true;
  try {
    if (!remember) { store.removeItem(FTP_PREFS_KEY); return; }
    store.setItem(FTP_PREFS_KEY, JSON.stringify({
      host: $("#ftpHost").value.trim(),
      port: $("#ftpPort").value,
      user: $("#ftpUser").value,
      password: $("#ftpPassword").value,
      path: $("#ftpPath").value.trim(),
      tls: $("#ftpTls").checked,
      interval: $("#ftpInterval").value,
      remember: true,
    }));
  } catch (e) { /* storage may be unavailable */ }
}

function ftpPrefsChanged() { ftpSavePrefs(); }

/* ---------- collapsed-panel persistence (survives page reload) ---------- */
const COLLAPSED_KEY = "hldsmon.ui.collapsed.v1";

function collapsedLoad() {
  const store = ftpPrefsStore();
  if (!store) return null;
  try {
    const raw = store.getItem(COLLAPSED_KEY);
    if (!raw) return null;
    const obj = JSON.parse(raw);
    return (obj && typeof obj === "object") ? obj : null;
  } catch (e) { return null; }
}

function collapsedSave() {
  const store = ftpPrefsStore();
  if (!store) return;
  try { store.setItem(COLLAPSED_KEY, JSON.stringify(state.collapsed)); }
  catch (e) { /* storage may be unavailable */ }
}

/* ---------- dataset-display persistence (combined panel; survives reload) ---------- */
const DATASETS_KEY = "hldsmon.ui.datasets.v1";

function datasetsLoad() {
  const store = ftpPrefsStore();
  if (!store) return;
  let d = null;
  try { d = JSON.parse(store.getItem(DATASETS_KEY) || "null"); } catch (e) { d = null; }
  if (!d || typeof d !== "object") return;
  if (Array.isArray(d.allSeries)) {
    const chosen = d.allSeries.filter(k => ALL_DATASET_KEYS.indexOf(k) !== -1);
    state.allSeries = ALL_DATASET_KEYS.filter(k => chosen.indexOf(k) !== -1);
  }
  if (typeof d.allNormalize === "boolean") state.allNormalize = d.allNormalize;
  if (typeof d.showEvents === "boolean") state.showEvents = d.showEvents;
  if (typeof d.datasetsHelpOpen === "boolean") state.datasetsHelpOpen = d.datasetsHelpOpen;
  if (Array.isArray(d.playerMetrics)) {
    state.playerMetrics = d.playerMetrics.filter(m => PLAYER_METRICS.some(pm => pm.key === m));
  }
}

function datasetsSave() {
  const store = ftpPrefsStore();
  if (!store) return;
  try {
    store.setItem(DATASETS_KEY, JSON.stringify({
      allSeries: state.allSeries.slice(),
      allNormalize: state.allNormalize,
      showEvents: state.showEvents,
      datasetsHelpOpen: state.datasetsHelpOpen,
      playerMetrics: state.playerMetrics.slice(),
    }));
  } catch (e) { /* storage may be unavailable */ }
}

/* ---------- sticky «Период» persistence (REQ-L8; survives reload) ---------- */
const STICKY_KEY = "hldsmon.ui.sticky.v1";
/* compact «Период» target height in px (QAS-L17; asserted by the page selfTest) */
const PERIOD_MAX_HEIGHT_PX = 96;
/* follow hit area: dragging the right handle within this many SCREEN px of the
   track end turns following ON (no upper bound). Converted to viewBox/time units
   against the rendered SVG width inside buildPeriodTimeline.commit(). */
const FOLLOW_SNAP_PX = 10;

function stickyLoad() {
  const store = ftpPrefsStore();
  if (!store) return;
  let v = null;
  try { v = store.getItem(STICKY_KEY); } catch (e) { v = null; }
  if (v === "0") state.sticky = false;
  else if (v === "1") state.sticky = true;
}

function stickySave() {
  const store = ftpPrefsStore();
  if (!store) return;
  try { store.setItem(STICKY_KEY, state.sticky ? "1" : "0"); }
  catch (e) { /* storage may be unavailable */ }
}

/* applySticky: flip the pinning immediately (no reload) and persist the choice. */
function applySticky(on) {
  state.sticky = !!on;
  const p = $("#periodPanel") || document.querySelector(".panel-sticky");
  if (p) p.classList.toggle("no-sticky", !state.sticky);
  stickySave();
}

async function ftpPost(url, body) {
  const res = await fetch(url, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body),
  });
  let data;
  try { data = await res.json(); }
  catch (e) { throw new Error("Некорректный ответ сервера (не JSON)."); }
  if (!res.ok || !data || data.ok !== true) {
    throw new Error((data && data.error) ? data.error : ("HTTP " + res.status));
  }
  return data;
}

function setFtpControls() {
  const on = !!ftp.session;
  const connect = $("#ftpConnect");
  connect.disabled = ftp.busy;
  connect.textContent = (ftp.busy && !on) ? "Подключение…" : "Подключить";
  $("#ftpRefresh").disabled = !on || ftp.busy;
  const earlier = $("#ftpLoadEarlier");
  if (earlier) earlier.disabled = !on || ftp.busy || ftp.reachedStart;
  $("#ftpClose").disabled = !on || ftp.busy;
  $("#ftpAuto").disabled = !on;
  $("#ftpInterval").disabled = !on;
  if (!on && $("#ftpAuto").checked) ftpStopAuto();
}

async function ftpConnect() {
  if (ftp.busy) return;
  const spec = ftpFormSpec();
  if (!spec.host) { setFtpStatus("Укажите хост.", "error"); return; }
  if (!spec.path) { setFtpStatus("Укажите путь к файлу.", "error"); return; }
  const previous = ftp.session;
  ftp.busy = true;
  setFtpControls();
  setFtpStatus("Подключение и загрузка файла…", "info");
  const job = ftpNewJob();
  spec.job = job;
  ftpProgressStart(job, "Загрузка файла…");
  try {
    if (previous) { await ftpSendClose(previous); ftpStopAuto(); }
    const data = await ftpPost("/api/ftp/connect", spec);
    ftp.session = data.session;
    ftp.path = (data.ftp && data.ftp.path) ? data.ftp.path : spec.path;
    ftp.lastError = null;
    ftp.reachedStart = !!(data.ftp && data.ftp.reached_start);
    if (!$("#ftpRemember") || !$("#ftpRemember").checked) $("#ftpPassword").value = "";
    ftpSavePrefs();
    state.demo = false;
    state.source = "ftp";
    state.handle = data.handle || null;   // FTP export/bundle becomes available via the handle
    state.coarse = false;
    state.window = null;
    state.fullRange = null;
    state.period = { from: null, to: null };
    state.selectedClient = null;
    ftpUpdateRange(data.ftp);
    render(data);
    setFtpStatus("Подключено: " + ftp.path + " · " + fmtInt(data.ftp.records) +
      " записей (" + humanBytes(data.ftp.bytes) + ")" + ftpLogEndSuffix() +
      ftpWindowSuffix(data.ftp), "ok");
  } catch (err) {
    ftp.session = null;
    setFtpStatus("Ошибка подключения: " + (err && err.message ? err.message : String(err)), "error");
    toast("FTP: " + (err && err.message ? err.message : String(err)), "error");
  } finally {
    ftpProgressStop();
    ftp.busy = false;
    setFtpControls();
  }
}

function isUiInteracting() {
  const ae = document.activeElement;
  if (!ae) return false;
  const t = ae.tagName;
  return t === "SELECT" || t === "INPUT" || t === "TEXTAREA" || ae.isContentEditable === true;
}

async function ftpRefresh(manual) {
  // Auto-refresh must not rebuild the DOM mid-interaction: an open <select> would
  // close and typing would be disrupted. Skip this tick; the next one resumes and
  // no bytes are lost (the server-side FTP session keeps its offset).
  if (!manual && isUiInteracting()) return;
  if (ftp.busy || !ftp.session) return;
  ftp.busy = true;
  if (manual) setFtpControls();
  if (manual) ftpProgressStart(ftp.session, "Обновление…");
  try {
    const data = await ftpPost("/api/ftp/refresh", { session: ftp.session });
    ftp.lastError = null;
    state.source = "ftp";
    if (data.handle) state.handle = data.handle;
    render(data);
    const f = data.ftp || {};
    ftp.reachedStart = !!(f && f.reached_start);
    ftpUpdateRange(f);
    const now = new Date().toISOString().slice(11, 19);
    setFtpStatus("Обновлено " + now + " UTC · +" + humanBytes(f.new_bytes) +
      " / +" + fmtInt(f.new_records) + " записей · всего " + fmtInt(f.records) +
      " записей (" + humanBytes(f.bytes) + ")" + ftpLogEndSuffix() +
      ftpWindowSuffix(f), "ok");
  } catch (err) {
    const msg = (err && err.message ? err.message : String(err));
    if (ftp.lastError !== msg) { ftp.lastError = msg; toast("FTP-обновление: " + msg, "error"); }
    setFtpStatus("Ошибка обновления: " + msg + " · показаны последние удачные данные", "error");
    if (/unknown session/i.test(msg)) {
      ftpStopAuto();
      ftp.session = null;
      setFtpControls();
    }
  } finally {
    if (manual) ftpProgressStop();
    ftp.busy = false;
    setFtpControls();
  }
}

async function ftpLoadEarlier() {
  // Page the loaded window BACKWARD: fetch the previous slice of the remote file
  // on demand. Mirrors manual refresh (progress bar + parse phase) and never runs
  // once the file start has been reached or while another request is in flight.
  if (ftp.busy || !ftp.session || ftp.reachedStart) return;
  ftp.busy = true;
  setFtpControls();
  ftpProgressStart(ftp.session, "Загрузка старее…");
  try {
    const data = await ftpPost("/api/ftp/load-earlier", { session: ftp.session, window_s: selectedFtpWindow() });
    ftp.lastError = null;
    state.source = "ftp";
    if (data.handle) state.handle = data.handle;
    render(data);
    const f = data.ftp || {};
    ftp.reachedStart = !!f.reached_start;
    ftpUpdateRange(f);
    setFtpStatus("Догружено старее: +" + fmtInt(f.older_records) + " записей (" +
      humanBytes(f.older_bytes) + ") · с " + fmtIso(f.start_t) + ftpWindowSuffix(f), "ok");
  } catch (err) {
    const msg = (err && err.message ? err.message : String(err));
    if (ftp.lastError !== msg) { ftp.lastError = msg; toast("FTP-загрузка старее: " + msg, "error"); }
    setFtpStatus("Ошибка загрузки старее: " + msg + " · показаны последние удачные данные", "error");
    if (/unknown session/i.test(msg)) {
      ftpStopAuto();
      ftp.session = null;
    }
  } finally {
    ftpProgressStop();
    ftp.busy = false;
    setFtpControls();
  }
}

async function ftpSendClose(sessionId) {
  try {
    await fetch("/api/ftp/close", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ session: sessionId }),
    });
  } catch (e) { /* best effort */ }
}

function ftpDisconnect() {
  const sid = ftp.session;
  ftpStopAuto();
  ftp.session = null;
  ftp.reachedStart = false;
  $("#ftpPassword").value = "";
  ftpHideRange();
  setFtpControls();
  setFtpStatus("FTP-источник отключён.", "info");
  if (sid) ftpSendClose(sid);
}

// Cancel the timer + auto flag WITHOUT touching the checkbox. Used both when
// stopping (user unticks / disconnect) and when (re)starting, so that starting
// auto no longer clobbers the freshly-ticked box back to unchecked.
function ftpCancelTimer() {
  if (ftp.timer) { clearInterval(ftp.timer); ftp.timer = null; }
  ftp.auto = false;
}

function ftpStopAuto() {
  ftpCancelTimer();
  const cb = $("#ftpAuto");
  if (cb) cb.checked = false;
}

function ftpStartAuto() {
  ftpCancelTimer();
  ftp.auto = true;
  ftp.timer = setInterval(() => { ftpRefresh(false); }, ftp.intervalMs);
  const cb = $("#ftpAuto");
  if (cb) cb.checked = true;
}

function ftpIntervalChanged() {
  const n = parseInt($("#ftpInterval").value, 10);
  ftp.intervalMs = (isNum(n) && n >= 1 ? n : 5) * 1000;
  if (ftp.auto) ftpStartAuto();
}

/* ----- summary cards ----- */
function buildSummary(result, view) {
  const cardWrap = el("div", "cards");
  const d = result.digest || {};
  const period = d.period || {};
  const players = Array.isArray(d.players) ? d.players : [];
  const active = !!(view && view.active);
  const tRange = (view && view.tRange) || { start: null, end: null };
  const dur = (tRange.start != null && tRange.end != null) ? (tRange.end - tRange.start) : null;
  const shownRecords = active
    ? ((view ? view.serverSamples + view.clientSamples + view.drops.length : 0))
    : result.records_count;
  const dropCount = active && view ? view.drops.length : d.drop_count;

  const add = (k, v, s, cls, small) => {
    const c = el("div", "card" + (cls ? " " + cls : ""));
    c.appendChild(el("div", "k", k));
    c.appendChild(el("div", "v" + (small ? " sm" : ""), v));
    if (s) c.appendChild(el("div", "s", s));
    cardWrap.appendChild(c);
  };

  add("Записей", fmtInt(result.records_count),
    active ? "в периоде: " + fmtInt(shownRecords) : null);
  add(
    "Период",
    (tRange.start != null ? fmtIso(tRange.start) : "—"),
    (tRange.end != null ? "→ " + fmtIso(tRange.end) : "нет данных") + (active ? " · фильтр" : ""),
    null, true
  );
  add("Длительность", fmtDuration(dur), dur != null ? "секунд: " + fmtInt(dur) : null);
  add("Игроков", fmtInt(players.length), players.length ? "ID: " + players.slice(0, 8).join(", ") + (players.length > 8 ? "…" : "") : "0 игроков", players.length ? null : "accent-warn");
  add("Drop'ов", fmtInt(dropCount), active ? "из " + fmtInt(d.drop_count) + " всего" : null, (dropCount > 0 ? "accent-err" : "accent-ok"));
  add("Hitch-строк", fmtInt(d.hitch_lines), null, (d.hitch_lines > 0 ? "accent-warn" : null));
  add("Lag spikes", fmtInt(d.lag_spikes), null, (d.lag_spikes > 0 ? "accent-warn" : null));
  return cardWrap;
}

/* buildGlobalClientPicker: the ONE global client selector. It lives in the sticky
   «Период» panel so it stays visible while scrolling. One <optgroup> per player with a
   «<ник> (весь)» option plus one <option> per session; sessions with no player
   group fall under «Прочие сессии». Sets state.selectedClient (defaulting to the first
   player, else the first session) and keeps the dependent UI in sync on change. */
function buildGlobalClientPicker(view) {
  const picker = el("select");
  picker.id = "clientPicker";
  picker.appendChild(new Option("—", ""));
  const players = (view && Array.isArray(view.players)) ? view.players : [];
  const covered = {};
  for (const p of players) {
    const og = document.createElement("optgroup");
    const auth = p.steamid64 || p.authid || p.player || "—";
    og.label = (p.name || "без имени") + " (" + auth + ")";
    const wholeOpt = new Option((p.name || "без имени") + " (весь)", "player:" + p.player);
    wholeOpt.title = p.sessions.length + " сессий";
    og.appendChild(wholeOpt);
    for (const s of p.sessions.slice().sort(byUserId)) {
      covered[String(s.session)] = true;
      og.appendChild(new Option(sessionOptionLabel(s), String(s.session)));
    }
    picker.appendChild(og);
  }
  // sessions with no player group (no identifying authid) as a fallback group
  const rest = ((view && view.clients) || []).filter(c => !covered[String(c.session)]);
  if (rest.length) {
    const og = document.createElement("optgroup");
    og.label = "Прочие сессии";
    for (const c of rest.slice().sort(byUserId)) og.appendChild(new Option(sessionOptionLabel(c), String(c.session)));
    picker.appendChild(og);
  }

  // validate the global selection; fall back to the first player, else the first session
  const exists = (v) => {
    if (v == null) return false;
    const s = String(v);
    if (s.indexOf("player:") === 0) return players.some(p => String(p.player) === s.slice(7));
    return !!(view && view.clientSeries && view.clientSeries[s] != null);
  };
  let sel = state.selectedClient;
  if (!exists(sel)) {
    if (players.length) sel = "player:" + players[0].player;
    else sel = (view && view.clients && view.clients.length) ? String(view.clients[0].session) : null;
  }
  state.selectedClient = sel;
  if (sel != null) picker.value = String(sel);

  picker.addEventListener("change", () => {
    state.selectedClient = picker.value || null;
    if (refreshAllPanelUI) refreshAllPanelUI();       // refresh chips + metric boxes + sync
    const ah = $("#allChart");
    if (ah) fillAllChart(ah, state.view || view);
    const host = $("#clientCharts");
    if (host) renderClientCharts(host, state.view || view, state.selectedClient);
    markSessionChips();
  });
  return picker;
}

/* ----- period selector (two compact rows; target <= PERIOD_MAX_HEIGHT_PX) -----
   Row 1 (header): range text + live cue + the ONE global client picker + sticky toggle.
   Row 2 (body): the full-width draggable timeline — the ONLY way to edit the period. */
function buildPeriodPanel(result) {
  const view = state.view || computeView(result);
  const fr = (view && view.fullRange) || {};
  const fullEnd = isNum(fr.end) ? fr.end : null;
  const follow = !isNum(state.period.to);   // no upper bound == following the newest sample

  // selected range as text (seconds precision, browser timezone). While following
  // the right side shows the newest sample / the open end of the log.
  const rangeEl = el("span", "period-range");
  rangeEl.title = "Выбранный период (таймзона браузера)";
  const fullStart = isNum(fr.start) ? fr.start : null;
  const paintRange = (from, to) => {
    const left = isNum(from) ? from : fullStart;   // no lower bound == start of the log
    const right = isNum(to) ? to : fullEnd;         // no upper bound == newest sample (follow)
    rangeEl.textContent = fmtRange(left) + " — " + fmtRange(right);
  };
  paintRange(state.period.from, state.period.to);

  // optional non-interactive follow cue (following == no upper bound)
  const live = el("span", "period-live" + (follow && fullEnd != null ? " on" : ""));
  live.title = "Правая граница следует за новыми данными";
  live.appendChild(el("span", "live-dot"));
  live.appendChild(el("span", null, "слежение"));

  // header row: range text + live cue + the global client picker + sticky toggle
  const headRow = el("div", "period-row");
  headRow.appendChild(rangeEl);
  headRow.appendChild(live);

  // the ONE global client selector, kept visible in the sticky header
  const clientField = el("div", "field");
  clientField.appendChild(el("label", null, "Клиент"));
  clientField.appendChild(buildGlobalClientPicker(view));
  headRow.appendChild(clientField);

  // REQ-L8: user-controlled pinning, persisted in localStorage, applied live
  const stickyLabel = el("label", "period-sticky-toggle");
  stickyLabel.title = "Закрепить блок «Период» при прокрутке (состояние сохраняется)";
  const stickyCb = el("input");
  stickyCb.type = "checkbox"; stickyCb.id = "periodSticky";
  stickyCb.checked = state.sticky;
  stickyCb.setAttribute("aria-label", "Закрепить блок периода");
  stickyCb.addEventListener("change", () => applySticky(stickyCb.checked));
  stickyLabel.appendChild(stickyCb);
  stickyLabel.appendChild(el("span", null, "закрепить"));
  headRow.appendChild(stickyLabel);

  // second row: the timeline on its OWN full-width line
  const tlRow = el("div", "period-timeline-row");
  const tl = el("div", "period-tl");
  tl.appendChild(buildPeriodTimeline(view, {
    onLive: (from, to) => paintRange(from, to),
    onCommit: (from, to) => applyPeriodValues(from, to),
  }));
  tlRow.appendChild(tl);

  const pill = (state.period.from != null || state.period.to != null) ? "фильтр активен" : "полный диапазон";
  const panelEl = panel("Период", pill, tlRow, headRow);
  panelEl.id = "periodPanel";
  panelEl.classList.add("panel-sticky", "period-panel");
  if (!state.sticky) panelEl.classList.add("no-sticky");
  return panelEl;
}

/* buildPeriodTimeline: draggable brush spanning the FULL log range. */
function buildPeriodTimeline(view, cb) {
  cb = cb || {};
  const wrap = el("div", "period-timeline");
  const fr = (view && view.fullRange) || {};
  const fullStart = isNum(fr.start) ? fr.start : null;
  const fullEnd = isNum(fr.end) ? fr.end : null;
  if (fullStart == null || fullEnd == null || fullEnd <= fullStart) {
    wrap.appendChild(el("div", "period-timeline-empty", "Недостаточно данных для таймлайна периода"));
    return wrap;
  }

  const ts = (view.result && view.result.series && view.result.series.t) || [];
  let sample = 1;
  if (ts.length > 1 && isNum(ts[0]) && isNum(ts[1]) && ts[1] > ts[0]) sample = ts[1] - ts[0];

  const VW = 720, VH = 44, tx0 = 12, tx1 = VW - 12;
  const span = fullEnd - fullStart;
  const t2x = t => tx0 + ((t - fullStart) / span) * (tx1 - tx0);
  const x2t = x => fullStart + ((x - tx0) / (tx1 - tx0)) * span;
  const clampT = t => Math.max(fullStart, Math.min(fullEnd, t));
  const follow = !isNum(state.period.to);   // no upper bound == tracking the newest sample

  const svg = svgEl("svg", {
    class: "period-brush", viewBox: "0 0 " + VW + " " + VH,
    preserveAspectRatio: "none", "aria-label": "Выбор периода",
  });
  if (follow) svg.classList.add("follow");

  // track, dimmed out-of-selection areas, highlighted selection
  svg.appendChild(svgEl("rect", { class: "period-track", x: tx0, y: 14, width: tx1 - tx0, height: 16, rx: 4 }));
  const dimL = svgEl("rect", { class: "period-dim", x: tx0, y: 14, width: 0, height: 16 });
  const dimR = svgEl("rect", { class: "period-dim", x: tx0, y: 14, width: 0, height: 16 });
  svg.appendChild(dimL); svg.appendChild(dimR);
  const selRect = svgEl("rect", { class: "period-sel", x: tx0, y: 10, width: tx1 - tx0, height: 24, rx: 4 });
  svg.appendChild(selRect);

  function mkHandle(label) {
    const g = svgEl("g", { class: "period-brush-handle", tabindex: "0", role: "slider",
      "aria-label": label, "aria-orientation": "horizontal" });
    g.appendChild(svgEl("rect", { class: "handle-hit", x: -12, y: 4, width: 24, height: 36, rx: 4 }));
    g.appendChild(svgEl("rect", { class: "handle-bar", x: -2.5, y: 6, width: 5, height: 32, rx: 2.5 }));
    g.appendChild(svgEl("line", { class: "handle-grip", x1: -0.5, y1: 15, x2: -0.5, y2: 29 }));
    g.appendChild(svgEl("line", { class: "handle-grip", x1: 0.5, y1: 15, x2: 0.5, y2: 29 }));
    return g;
  }
  const hLeft = mkHandle("Начало периода");
  const hRight = mkHandle("Конец периода");
  hRight.classList.add("end");
  svg.appendChild(hLeft); svg.appendChild(hRight);
  // live-end dot drawn on top of the right handle while following
  const endDot = svgEl("circle", { class: "period-end-dot", cx: 0, cy: 8, r: 3.2 });
  svg.appendChild(endDot);

  const labelEl = el("div", "period-timeline-label");
  wrap.appendChild(svg);
  wrap.appendChild(labelEl);

  let curFrom = isNum(state.period.from) ? clampT(state.period.from) : fullStart;
  let curTo = isNum(state.period.to) ? clampT(state.period.to) : fullEnd;
  if (curTo < curFrom) { const tmp = curFrom; curFrom = curTo; curTo = tmp; }

  function redraw() {
    const xf = t2x(curFrom), xt = t2x(curTo);
    dimL.setAttribute("width", Math.max(0, xf - tx0));
    dimR.setAttribute("x", xt);
    dimR.setAttribute("width", Math.max(0, tx1 - xt));
    selRect.setAttribute("x", xf);
    selRect.setAttribute("width", Math.max(0.5, xt - xf));
    hLeft.setAttribute("transform", "translate(" + xf + ",0)");
    hRight.setAttribute("transform", "translate(" + xt + ",0)");
    endDot.setAttribute("transform", "translate(" + xt + ",0)");
    labelEl.textContent = fmtRange(curFrom) + " — " + fmtRange(curTo);
  }
  function setSel(from, to, live) {
    curFrom = clampT(from); curTo = clampT(to);
    if (curFrom > curTo) { const tmp = curFrom; curFrom = curTo; curTo = tmp; }
    redraw();
    if (live && cb.onLive) cb.onLive(curFrom, curTo);
  }
  // atEnd: commit came from the right handle (drag/keyboard) -> snap the end back to follow.
  function commit(atEnd) {
    let from = curFrom, to = curTo;
    if (atEnd && fullEnd != null) {
      // Follow turns ON only when the right handle lands within FOLLOW_SNAP_PX SCREEN px
      // of the track end. Convert screen px -> viewBox units via the rendered SVG width
      // (svg.getBoundingClientRect().width / VW), then viewBox units -> seconds.
      const rect = svg.getBoundingClientRect();
      const pxPerVb = rect.width ? (rect.width / VW) : 0;
      let snap = sample;   // safe fallback when the SVG is not laid out (width 0)
      if (pxPerVb > 0) snap = (FOLLOW_SNAP_PX / pxPerVb) / (tx1 - tx0) * span;
      if (to >= fullEnd - snap) to = null;   // near the end -> no upper bound (follow ON)
    }
    if (cb.onCommit) cb.onCommit(from, to);
  }

  function pointerTime(ev) {
    const rect = svg.getBoundingClientRect();
    if (!rect.width) return fullStart;
    const vx = ((ev.clientX - rect.left) / rect.width) * VW;
    return clampT(x2t(vx));
  }

  let dragging = null;
  function begin(ev, mode) {
    ev.preventDefault();
    ev.stopPropagation();
    dragging = { mode: mode, id: ev.pointerId };
    if (mode === "move") dragging.offset = pointerTime(ev) - curFrom;
    try { svg.setPointerCapture(ev.pointerId); } catch (e) { /* capture unsupported */ }
  }
  hLeft.addEventListener("pointerdown", e => begin(e, "from"));
  hRight.addEventListener("pointerdown", e => begin(e, "to"));
  selRect.addEventListener("pointerdown", e => begin(e, "move"));
  svg.addEventListener("pointermove", ev => {
    if (!dragging || ev.pointerId !== dragging.id) return;
    ev.preventDefault();
    const t = pointerTime(ev);
    if (dragging.mode === "from") setSel(Math.min(t, curTo - sample), curTo, true);
    else if (dragging.mode === "to") setSel(curFrom, Math.max(t, curFrom + sample), true);
    else {
      const s = curTo - curFrom;
      let f = t - dragging.offset;
      f = Math.max(fullStart, Math.min(fullEnd - s, f));
      setSel(f, f + s, true);
    }
  });
  function finish(ev) {
    if (!dragging || (ev && ev.pointerId !== dragging.id)) return;
    const mode = dragging.mode;
    dragging = null;
    try { svg.releasePointerCapture(ev.pointerId); } catch (e) { /* ignore */ }
    commit(mode === "to");
  }
  svg.addEventListener("pointerup", finish);
  svg.addEventListener("pointercancel", finish);

  function keyNudge(which, dir) {
    if (which === "from") setSel(Math.min(curFrom + dir * sample, curTo - sample), curTo, true);
    else setSel(curFrom, Math.max(curTo + dir * sample, curFrom + sample), true);
  }
  function onKey(which) {
    return (e) => {
      if (e.key === "ArrowLeft") { e.preventDefault(); keyNudge(which, -1); }
      else if (e.key === "ArrowRight") { e.preventDefault(); keyNudge(which, 1); }
      else if (e.key === "Enter" || e.key === " ") { e.preventDefault(); commit(which === "to"); }
    };
  }
  function onKeyUp(which) {
    return (e) => { if (e.key === "ArrowLeft" || e.key === "ArrowRight") commit(which === "to"); };
  }
  hLeft.addEventListener("keydown", onKey("from"));
  hRight.addEventListener("keydown", onKey("to"));
  hLeft.addEventListener("keyup", onKeyUp("from"));
  hRight.addEventListener("keyup", onKeyUp("to"));

  redraw();
  return wrap;
}

/* applyPeriodValues: the single funnel used by the timeline brush (the only period
   editor). For local uploads the period is SERVER-side: re-request the window (the
   file is streamed again as a Blob, never re-read into a JS string). FTP/demo keep
   client-side filtering of the already-loaded data. */
function applyPeriodValues(from, to) {
  state.period = { from: from, to: to };
  if (state.source === "local") { fetchAnalyze({ from: from, to: to, reset: false }); return; }
  render(state.result);
}

/* ----- counts by type ----- */
function buildTypes(counts) {
  const wrap = el("div", "bars");
  const entries = Object.keys(counts || {})
    .map(k => [k, counts[k]])
    .filter(e => isNum(e[1]) && e[1] > 0)
    .sort((a, b) => b[1] - a[1]);
  if (!entries.length) {
    wrap.appendChild(el("div", "empty", "нет записей"));
    return wrap;
  }
  const max = Math.max.apply(null, entries.map(e => e[1]));
  for (const [name, cnt] of entries) {
    const row = el("div", "bar-row");
    row.appendChild(el("div", "bar-label", name));
    const track = el("div", "bar-track");
    const fill = el("div", "bar-fill");
    fill.style.width = Math.max(2, (cnt / max) * 100) + "%";
    track.appendChild(fill);
    row.appendChild(track);
    row.appendChild(el("div", "bar-val", fmtInt(cnt)));
    wrap.appendChild(row);
  }
  return wrap;
}

/* ----- anomalies ----- */
function buildAnomalies(list) {

/* ----- drops filtering (shared by the table and the time chart) ----- */
function dropsMatch(r, reason, q) {
  if (reason && r.reason !== reason) return false;
  if (!q) return true;
  const hay = [r.reason, r.category, r.observed_via, r.id, r.gen, r.session,
    r.userid, r.name, r.authid, r.steamid64, r.ip, r.slot]
    .map(v => v == null ? "" : String(v)).join(" ").toLowerCase();
  return hay.indexOf(q) !== -1;
}

  const q = (state.dropSearch || "").trim().toLowerCase();
  return (Array.isArray(drops) ? drops : [])
    .filter(r => dropsMatch(r, reason, q))
    .sort((a, b) => {
      const ta = isNum(a.t) ? a.t : Infinity;
      const tb = isNum(b.t) ? b.t : Infinity;
      return ta - tb;
    });
}

/* ----- pagination (shared by the clients and drops tables) ----- */
function makePaginator(rows, key, onChange) {
  const list = Array.isArray(rows) ? rows : [];
  const total = list.length;
  let size = state.pageSize[key];
  if (size == null) size = 25;
  if (size < 0) size = 0;
  const pageCount = size > 0 ? Math.max(1, Math.ceil(total / size)) : 1;
  let page = state.page[key] || 1;
  if (page < 1) page = 1;
  if (page > pageCount) page = pageCount;
  state.page[key] = page;
  const start = size > 0 ? (page - 1) * size : 0;
  const end = size > 0 ? Math.min(total, start + size) : total;
  const slice = list.slice(start, end);

  const wrap = el("div", "pager");
  const sizeLabel = el("label", "pager-size");
  sizeLabel.appendChild(document.createTextNode("на странице"));
  const sel = el("select");
  [["25", 25], ["50", 50], ["100", 100], ["все", 0]].forEach(([text, val]) => {
    const o = new Option(text, String(val));
    if (val === size) o.selected = true;
    sel.appendChild(o);
  });
  sel.addEventListener("change", () => {
    state.pageSize[key] = parseInt(sel.value, 10) || 0;
    state.page[key] = 1;
    onChange();
  });
  sizeLabel.appendChild(sel);
  wrap.appendChild(sizeLabel);

  const prev = el("button", "btn sm ghost", "‹");
  prev.type = "button";
  prev.title = "Предыдущая страница";
  prev.disabled = page <= 1;
  prev.addEventListener("click", () => { state.page[key] = page - 1; onChange(); });
  wrap.appendChild(prev);

  const label = el("span", "pager-label",
    "показано " + (total ? start + 1 : 0) + "–" + end + " из " + total + " · стр. " + page + "/" + pageCount);
  wrap.appendChild(label);

  const next = el("button", "btn sm ghost", "›");
  next.type = "button";
  next.title = "Следующая страница";
  next.disabled = page >= pageCount;
  next.addEventListener("click", () => { state.page[key] = page + 1; onChange(); });
  wrap.appendChild(next);

  return { wrap, slice };
}

/* ----- drops over time (count bars; shares the drops filter) ----- */
const DROP_BUCKET_STEPS = [1, 2, 5, 10, 15, 30, 60, 120, 300, 600, 900, 1800, 3600, 7200, 21600, 43200, 86400, 172800];
function niceBucketStep(span) {
  const target = Math.max(1, span / 40);
  for (const s of DROP_BUCKET_STEPS) if (s >= target) return s;
  return DROP_BUCKET_STEPS[DROP_BUCKET_STEPS.length - 1];
}
function buildDropBins(drops, lo, hi) {
  if (!drops.length || !isNum(lo) || !isNum(hi) || hi <= lo) return null;
  const step = niceBucketStep(hi - lo);
  const n = Math.max(1, Math.min(240, Math.ceil((hi - lo) / step)));
  const counts = new Array(n).fill(0);
  const centers = new Array(n);
  for (let i = 0; i < n; i++) centers[i] = lo + (i + 0.5) * step;
  for (const d of drops) {
    if (!isNum(d.t)) continue;
    let i = Math.floor((d.t - lo) / step);
    if (i < 0) i = 0; else if (i >= n) i = n - 1;
    counts[i]++;
  }
  return { step: step, lo: lo, centers: centers, counts: counts };
}
function buildDropsChart(view) {
  const drops = filteredDrops(view && view.drops);
  if (!drops.length) return el("div", "empty", "нет отключений");
  const tRange = (view && view.tRange) || {};
  let lo = tRange.start, hi = tRange.end;
  if (!isNum(lo) || !isNum(hi) || hi <= lo) {
    const r = rangeOf(drops.map(d => d.t));
    lo = r.start; hi = r.end;
  }
  const bin = buildDropBins(drops, lo, hi);
  if (!bin || !bin.counts.some(c => c > 0)) return el("div", "empty", "нет отключений");
  const spec = {
    title: "Отключения по времени", unit: "шт", fmt: v => fmtInt(v),
    zeroBase: true, bars: true, bucketStep: bin.step,
    lines: [{ name: "drops", color: COLORS.max, values: bin.counts }],
  };
  return buildChart(bin.centers, spec, { events: (view && view.events) || [], showEvents: state.showEvents });
}

  if (!host) return;
  host.textContent = "";

function byUserId(a, b) {
  const ua = isNum(a && a.userid) ? a.userid : Infinity;
  const ub = isNum(b && b.userid) ? b.userid : Infinity;
  if (ua !== ub) return ua - ub;
  const ra = isNum(a && a.run) ? a.run : Infinity;
  const rb = isNum(b && b.run) ? b.run : Infinity;
  if (ra !== rb) return ra - rb;
  const sa = isNum(a && a.slot) ? a.slot : Infinity;
  const sb = isNum(b && b.slot) ? b.slot : Infinity;
  if (sa !== sb) return sa - sb;
  return String(a && a.session).localeCompare(String(b && b.session));

/* ----- combined chart: overlay a toggleable subset of server datasets ----- */
/* step-resample a client series onto the server time axis (last sample <= t).
   Past the client's LAST sample the result is null (no step-hold tail), so a
   disconnected player's line stops instead of drawing a flat static line. */
function alignToServerTime(clientT, values, t) {
  const n = Array.isArray(t) ? t.length : 0;
  const out = new Array(n).fill(null);
  if (!Array.isArray(clientT) || !clientT.length || !Array.isArray(values)) return out;
  let lastT = null;
  for (let k = clientT.length - 1; k >= 0; k--) {
    if (isNum(clientT[k])) { lastT = clientT[k]; break; }
  }
  if (lastT == null) return out;
  let j = 0;
  for (let i = 0; i < n; i++) {
    const ts = t[i];
    if (!isNum(ts)) continue;
    if (ts > lastT) continue;   // beyond the client's last sample -> line stops
    while (j < clientT.length) {
      const ct = clientT[j];
      if (isNum(ct) && ct > ts) break;
      j++;
    }
    if (j > 0) out[i] = values[j - 1];
  }
  return out;
}

/* step-resample a host series onto the server time axis (last sample <= t).
   A null sample stays null (gap: a missing value is never a zero), past the
   last host sample the line stops, and markers[i] flags the samples whose
   caveat bit is set (value present but not attributable). */
function alignHostToServerTime(hostSeries, key, t, caveatBit) {
  const n = Array.isArray(t) ? t.length : 0;
  const values = new Array(n).fill(null);
  const markers = new Array(n).fill(false);
  const ht = (hostSeries && Array.isArray(hostSeries.t)) ? hostSeries.t : [];
  const vals = (hostSeries && Array.isArray(hostSeries[key])) ? hostSeries[key] : [];
  const masks = (hostSeries && Array.isArray(hostSeries.caveat_mask)) ? hostSeries.caveat_mask : [];
  const at = [];
  for (let k = 0; k < ht.length; k++) if (isNum(ht[k])) at.push(k);
  if (!at.length) return { values: values, markers: markers };
  const lastT = ht[at[at.length - 1]];
  let p = 0;
  for (let i = 0; i < n; i++) {
    const ts = t[i];
    if (!isNum(ts) || ts > lastT) continue;
    while (p < at.length && ht[at[p]] <= ts) p++;
    if (p === 0) continue;
    const k = at[p - 1];
    const v = vals[k];
    values[i] = (v === undefined) ? null : v;
    const m = masks[k];
    markers[i] = isNum(v) && isNum(caveatBit) && caveatBit > 0 && isNum(m) && ((m & caveatBit) !== 0);
  }
  return { values: values, markers: markers };
}

/* resolve the ONE global selection (state.selectedClient) to a player object.

}

function buildAllChart(view) {
  view = view || state.view;
  const series = (view && view.series) || {};
  const t = Array.isArray(series.t) ? series.t : [];
  const chosen = ALL_DATASETS.filter(d => state.allSeries.indexOf(d.key) !== -1);
  const chosenHost = HOST_DATASETS.filter(d => state.allSeries.indexOf(d.key) !== -1);
  if (!chosen.length && !chosenHost.length) return el("div", "empty", "выберите хотя бы один датасет");
  const lines = [];
  for (const d of chosen) {
    const values = d.values(series);
    if (!Array.isArray(values) || !values.some(isNum)) continue;
    lines.push({ name: d.label, color: d.color, values: values, fmt: v => fmtFloat(v, d.dec), unit: d.unit });
  }
  /* host rows: aligned to server time, null = gap, caveat bit = ring marker */
  const hostSeries = (view && view.hostSeries) || null;
  const hc = (view && view.result && view.result.host_caveats) || {};
  if (chosenHost.length && hostSeries && Array.isArray(hostSeries.t) && hostSeries.t.length) {
    for (const d of chosenHost) {
      const info = hc[d.key] || null;
      const aligned = alignHostToServerTime(hostSeries, d.key, t, info ? info.bit : 0);
      if (!aligned.values.some(isNum)) continue;
      lines.push({
        name: d.label, color: d.color, values: aligned.values,
        fmt: v => fmtFloat(v, d.dec), unit: d.unit,
        markers: aligned.markers,
        markerNote: "⚠ caveated" + (info && info.source ? " (" + info.source + ")" : ""),
      });
    }
  }
  /* overlay the globally-selected player's chosen client metrics, resampled to server time */
  const pl = selectedPlayer(view);
  const cs = pl ? pl.series : null;
  const mkeys = state.playerMetrics;
  if (cs && mkeys.length) {
    const pname = (pl && pl.name) || String(pl.player);
    for (const key of mkeys) {
      const m = playerMetricDef(key);
      if (!m || !anyNum(cs[key])) continue;
      lines.push({ name: pname + " " + m.label, color: m.color,
        values: alignToServerTime(cs.t, cs[key], t),
        fmt: v => fmtFloat(v, m.dec), unit: m.unit });
    }
  }
  if (!t.length || !lines.length) return el("div", "empty", "нет данных");
  const normalize = state.allNormalize;
  const spec = {
    title: "Все датасеты",
    unit: normalize ? "относительно (0–100%)" : "сырые значения",
    fmt: normalize ? (v => fmtInt(v * 100)) : (v => fmtFloat(v, 1)),
    zeroBase: !normalize,
    lines: lines,
  };
  return buildChart(t, spec, { events: (view && view.events) || [], showEvents: state.showEvents, normalize: normalize });
}

  const list = (view && Array.isArray(view.config)) ? view.config
    : ((result && Array.isArray(result.config)) ? result.config : []);
  const body = el("div", "config-list");
  if (!list.length) body.appendChild(el("div", "empty", "нет config-записей за период"));
  else for (const c of list) body.appendChild(buildConfigRow(c));

}

function buildAllPanel(view) {
  const host = el("div");
  host.id = "allChart";

  /* players (by SteamID) + validate the ONE global selection before the first paint */
  const players = (view && Array.isArray(view.players)) ? view.players : [];
  const playerByKey = {};
  for (const p of players) playerByKey[String(p.player)] = p;

  if (state.selectedClient != null) {
    const sid = String(state.selectedClient);
    const ok = (sid.indexOf("player:") === 0)
      ? !!playerByKey[sid.slice(7)]
      : !!(view && view.clientSeries && view.clientSeries[sid] != null);
    if (!ok) state.selectedClient = null;   // gone after re-analyze / refresh
  }
  if (state.selectedClient == null) {
    if (players.length) state.selectedClient = "player:" + players[0].player;
    else if (view && view.clients && view.clients.length) state.selectedClient = String(view.clients[0].session);
  }

  fillAllChart(host, view);

  /* ---- dataset toggles (server + host; title = metric note) ---- */
  const legend = el("div", "ds-legend");
  function addDatasetToggle(d) {
    const lab = el("label", "evt-toggle");
    if (METRIC_NOTES[d.key]) lab.title = METRIC_NOTES[d.key];
    const cb = el("input");
    cb.type = "checkbox";
    cb.checked = state.allSeries.indexOf(d.key) !== -1;
    cb.addEventListener("change", () => {
      const i = state.allSeries.indexOf(d.key);
      if (cb.checked && i === -1) state.allSeries.push(d.key);
      else if (!cb.checked && i !== -1) state.allSeries.splice(i, 1);
      datasetsSave();
      fillAllChart(host, state.view);
    });
    const sw = el("i", "swatch");
    sw.style.background = d.color;
    if (METRIC_NOTES[d.key]) sw.title = METRIC_NOTES[d.key];
    lab.appendChild(cb);
    lab.appendChild(sw);
    lab.appendChild(document.createTextNode(" " + d.label));
    legend.appendChild(lab);
  }
  for (const d of ALL_DATASETS) addDatasetToggle(d);
  const hs = view && view.hostSeries;
  if (hs && Array.isArray(hs.t) && hs.t.length) {
    legend.appendChild(el("span", "leg-sep", "host:"));
    for (const d of HOST_DATASETS) addDatasetToggle(d);
  }

  const tools = el("div", "head-tools");
  tools.appendChild(legend);

  /* ---- the ONE global client selector lives in the sticky «Период» panel
     (buildGlobalClientPicker); here we keep only the selected player's session chips ---- */
  /* sessions of the selected player: one chip per session -> drill into it */
  const sWrap = el("div", "player-sessions");
  sWrap.id = "playerSessions";
  function renderPlayerSessions() {
    sWrap.textContent = "";
